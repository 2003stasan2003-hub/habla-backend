<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habla - Desktop Version</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; background-color: #0b0f12; color: #ffffff; overflow: hidden; }
        .app-container { width: 100vw; height: 100vh; background-color: #121619; display: flex; overflow: hidden; }
        .sidebar { width: 380px; background-color: #121619; border-right: 1px solid #1a2228; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #1a2228; display: flex; align-items: center; justify-content: space-between; }
        .sidebar-header h2 { font-size: 20px; color: #ffffff; }
        .back-link { color: #00e5ff; text-decoration: none; font-size: 14px; }
        .search-box { padding: 15px 20px; }
        .search-box input { width: 100%; background: #182026; border: 1px solid #222b32; padding: 10px 14px; border-radius: 10px; color: white; outline: none; }
        .chats-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 15px 20px; display: flex; align-items: center; gap: 15px; background-color: #161d22; border-left: 4px solid #00e5ff; }
        .avatar { width: 48px; height: 48px; background: #222b32; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #00e5ff; }
        .chat-info h4 { font-size: 15px; color: #ffffff; }
        .chat-info p { font-size: 13px; color: #8c9ba5; margin-top: 3px; }
        .chat-main { flex: 1; display: flex; flex-direction: column; background-color: #0e1215; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 18px 25px; background-color: #121619; border-bottom: 1px solid #1a2228; }
        .header-info h3 { font-size: 18px; font-weight: 600; }
        .header-info p { font-size: 12px; color: #8c9ba5; }
        .lang-select { background: #182026; color: #00e5ff; border: 1px solid #00e5ff55; padding: 8px 14px; border-radius: 8px; outline: none; cursor: pointer; }
        .chat-messages { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .message { max-width: 70%; padding: 14px 18px; border-radius: 16px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .message.incoming { background-color: #182026; border: 1px solid #00e5ff44; align-self: flex-start; }
        .message.outgoing { background-color: #1a2228; border: 1px solid #00e5ff; align-self: flex-end; }
        .footer { padding: 20px 25px; background-color: #121619; border-top: 1px solid #1a2228; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .input-box { width: 100%; display: flex; background: #182026; border: 1px solid #00e5ff; border-radius: 12px; padding: 10px 15px; align-items: center; }
        .input-box input { flex: 1; background: transparent; border: none; color: white; font-size: 15px; outline: none; }
        .send-btn { background: transparent; border: none; color: #00e5ff; font-size: 20px; cursor: pointer; padding: 0 6px; }
        .mic-container { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .mic-label { font-size: 12px; color: #8c9ba5; }
        .mic-btn { width: 60px; height: 60px; background: #182026; border: 2px solid #00e5ff; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 18px rgba(0, 229, 255, 0.25); }
        .mic-btn.recording { background: #00e5ff; }
        .mic-btn.recording .mic-icon { color: #121619; }
        .mic-icon { font-size: 24px; color: #00e5ff; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Habla [ПК]</h2>
                <a href="index.html" class="back-link">← Головна</a>
            </div>
            <div class="search-box"><input type="text" placeholder="Search chats..."></div>
            <div class="chats-list">
                <div class="chat-item">
                    <div class="avatar">D</div>
                    <div class="chat-info"><h4>David</h4><p>Good Day! How are you?</p></div>
                </div>
            </div>
        </div>
        <div class="chat-main">
            <div class="header">
                <div class="header-info"><h3>Habla Desktop</h3><p>David</p></div>
                <select id="targetLang" class="lang-select">
                    <option value="English">English</option>
                    <option value="Ukrainian">Ukrainian</option>
                    <option value="Spanish" selected>Spanish</option>
                    <option value="German">German</option>
                    <option value="French">French</option>
                </select>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message incoming">¡Hola! ¿Cómo estás?</div>
                <div class="message outgoing">Привіт, як справи?</div>
            </div>
            <div class="footer">
                <div class="input-box">
                    <input type="text" id="userInput" placeholder="Введіть текст або натисніть мікрофон...">
                    <button class="send-btn" id="sendBtn">➤</button>
                </div>
                <div class="mic-container">
                    <span class="mic-label" id="micStatus">Натисніть мікрофон для запису...</span>
                    <button class="mic-btn" id="micBtn"><span class="mic-icon">🎙</span></button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const BACKEND_URL = "https://habla-backend-ipqk.onrender.com/api/translate";
        let isRecording = false, recognition = null;
        const inputField = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');
        const targetLang = document.getElementById('targetLang');
        const micBtn = document.getElementById('micBtn');
        const micStatus = document.getElementById('micStatus');

        async function sendMessage() {
            const text = inputField.value.trim();
            const lang = targetLang.value;
            if (!text) return;

            appendMessage(text, 'outgoing');
            inputField.value = '';

            const loadingId = appendMessage("Переклад через Gemini...", 'incoming');

            try {
                const response = await fetch(BACKEND_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ text: text, targetLanguage: lang }) 
                });

                if (loadingId) loadingId.remove();

                if (response.ok) {
                    const data = await response.json();
                    appendMessage(data.translatedText, 'incoming');
                } else { 
                    appendMessage("Помилка сервера при перекладі.", 'incoming'); 
                }
            } catch (error) {
                if (loadingId) loadingId.remove();
                appendMessage("Помилка мережі (сервер недоступний).", 'incoming'); 
            }
        }

        function appendMessage(text, type) {
            const msgDiv = document.createElement('div'); 
            msgDiv.className = `message ${type}`; 
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv); 
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return msgDiv;
        }

        sendBtn.addEventListener('click', sendMessage);
        inputField.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition(); recognition.continuous = true; recognition.interimResults = true;
            recognition.onresult = e => {
                let t = ''; for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript;
                inputField.value = t;
            };
            recognition.onerror = () => stopRec(); recognition.onend = () => stopRec();
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) { alert("Використовуйте Google Chrome."); return; }
            if (!isRecording) {
                recognition.lang = 'uk-UA';
                recognition.start(); isRecording = true; micBtn.classList.add('recording');
                micStatus.innerText = "Йде запис... Натисніть знову, щоб зупинити.";
            } else { recognition.stop(); stopRec(); }
        });

        function stopRec() {
            isRecording = false; micBtn.classList.remove('recording');
            micStatus.innerText = "Записано! Натисніть стрілочку ➔ для відправки.";
        }
    </script>
</body>
</html>
