<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habla Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Неонова шапка додатку */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .menu-icon {
            font-size: 20px;
            cursor: pointer;
            color: #00ffcc;
        }
        .app-title {
            font-size: 18px;
            font-weight: 600;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }
        .online-badge {
            background-color: #334155;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #94a3b8;
        }

        /* Верхня панель вибору мови перекладу */
        .top-translation-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background-color: #0f172a;
            font-size: 14px;
            color: #94a3b8;
        }
        .lang-select {
            background-color: #1e293b;
            color: #00ffcc;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        /* Основний контейнер та сайдбар */
        .main-container {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background-color: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            bottom: 0;
            left: -300px;
            transition: left 0.3s ease;
            z-index: 10;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #334155;
        }
        .sidebar-header h3 {
            font-size: 16px;
            color: #00ffcc;
        }
        #closeSidebar {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
        }
        
        .sidebar-section {
            padding: 14px 16px;
            border-bottom: 1px solid #334155;
        }
        .section-title {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        /* Профіль та список користувачів у сайдбарі */
        .user-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #0f172a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .avatar-circle {
            width: 32px;
            height: 32px;
            background-color: #00ffcc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #0f172a;
            font-size: 14px;
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ffcc;
            border-radius: 50%;
            margin-left: auto;
            box-shadow: 0 0 6px #00ffcc;
        }

        /* Налаштування мови та звуку */
        .settings-select {
            width: 100%;
            background-color: #0f172a;
            color: #00ffcc;
            border: 1px solid #334155;
            padding: 8px;
            border-radius: 6px;
            outline: none;
        }
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .toggle-row span {
            font-size: 13px;
            color: #f8fafc;
        }

        /* Неоновий тумблер */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
        }
        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: #0f172a;
        }

        /* Зона чату */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0f172a;
            height: 100%;
        }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            background-color: #1e293b;
            padding: 12px;
            border-radius: 12px;
            max-width: 80%;
            border: 1px solid #334155;
        }

        /* Нижня панель введення */
        .chat-input-area {
            display: flex;
            padding: 12px 16px;
            background-color: #1e293b;
            gap: 10px;
            align-items: center;
            border-top: 1px solid #334155;
        }
        .chat-input-area input {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 12px 18px;
            color: white;
            outline: none;
            font-size: 14px;
        }
        .btn-icon {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }
        .btn-action {
            background-color: #00ffcc;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: #0f172a;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
    </style>
</head>
<body>

    <!-- Шапка додатку -->
    <div class="app-header">
        <div class="header-left">
            <div class="menu-icon" id="menuToggle">☰</div>
            <h1 class="app-title">Habla Mobile</h1>
        </div>
        <div class="online-badge" id="onlineCounter">Онлайн: 1</div>
    </div>

    <!-- Верхня панель вибору мови перекладу -->
    <div class="top-translation-bar">
        <span>Перекладати на:</span>
        <select id="targetLang" class="lang-select">
            <option value="English">English</option>
            <option value="Spanish" selected>Spanish</option>
            <option value="French">French</option>
            <option value="Ukrainian">Ukrainian</option>
        </select>
    </div>

    <div class="main-container">
        <!-- Сайдбар налаштувань -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>Configuración</h3>
                <button id="closeSidebar">✕</button>
            </div>

            <!-- Ваш профіль -->
            <div class="sidebar-section">
                <div class="section-title">Ваш профіль</div>
                <div class="user-card">
                    <div class="avatar-circle" id="myAvatar">T</div>
                    <span id="myName" style="font-weight: 500;">Tester</span>
                </div>
            </div>

            <!-- Користувачі -->
            <div class="sidebar-section">
                <div class="section-title">Користувачі</div>
                <div class="user-card" style="margin-bottom: 6px;">
                    <div class="avatar-circle" id="userSelfAvatar">T</div>
                    <span id="userSelfName">Tester (ви)</span>
                    <div class="status-dot"></div>
                </div>
                <div id="otherUsersContainer"></div>
            </div>

            <!-- Мова інтерфейсу (Spanish за замовчуванням) -->
            <div class="sidebar-section">
                <label class="section-title">Мова інтерфейсу:</label>
                <select class="settings-select" id="interfaceLang">
                    <option value="Spanish" selected>Spanish</option>
                    <option value="English">English</option>
                    <option value="Ukrainian">Ukrainian</option>
                </select>
            </div>

            <!-- Озвучування перекладу (вимкнено за замовчуванням) -->
            <div class="sidebar-section toggle-row">
                <span>Озвучування перекладу</span>
                <label class="switch">
                    <input type="checkbox" id="soundToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Зона чату -->
        <div class="chat-area">
            <div class="chat-messages" id="chatMessages">
                <!-- Повідомлення чату -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Введіть повідомлення або скажіть...">
                <button class="btn-icon" id="micBtn" title="Голосовий ввід">🎤</button>
                <button class="btn-action" id="sendBtn">➤</button>
            </div>
        </div>
    </div>

    <!-- Підключення Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Запит ім'я при вході
        const currentUsername = prompt("Введіть ваше ім'я:", "Tester") || "Tester";
        document.getElementById('myName').textContent = currentUsername;
        document.getElementById('myAvatar').textContent = currentUsername.charAt(0).toUpperCase();
        document.getElementById('userSelfName').textContent = `${currentUsername} (ви)`;
        document.getElementById('userSelfAvatar').textContent = currentUsername.charAt(0).toUpperCase();

        // Реєстрація на сервері
        socket.emit('register_user', { name: currentUsername });

        // Перевірка адмін-прав для StasAn
        socket.emit('check_admin');
        socket.on('admin_status', (data) => {
            if (data.isAdmin) {
                console.log("Адмін-доступ активовано для StasAn");
            }
        });

        // Керування сайдбаром
        const menuToggle = document.getElementById('menuToggle');
        const closeSidebar = document.getElementById('closeSidebar');
        const sidebar = document.getElementById('sidebar');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.add('open');
        });

        closeSidebar.addEventListener('click', () => {
            sidebar.classList.remove('open');
        });

        // Оновлення списку онлайн користувачів та лічильника
        socket.on('users_update', (users) => {
            document.getElementById('onlineCounter').textContent = `Онлайн: ${users.length}`;
            
            const container = document.getElementById('otherUsersContainer');
            container.innerHTML = '';

            users.forEach(user => {
                if (user.name !== currentUsername) {
                    const item = document.createElement('div');
                    item.className = 'user-card';
                    item.style.marginBottom = '6px';
                    item.innerHTML = `
                        <div class="avatar-circle" style="background-color: #334155; color: #00ffcc; box-shadow: none;">${user.name.charAt(0).toUpperCase()}</div>
                        <span>${user.name}</span>
                        <div class="status-dot"></div>
                    `;
                    container.appendChild(item);
                }
            });
        });

        // Відправка повідомлень
        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');
        const chatMessages = document.getElementById('chatMessages');

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            const targetLang = document.getElementById('targetLang').value;
            socket.emit('chat_message', { 
                text: text, 
                targetLanguage: targetLang 
            });
            messageInput.value = '';
        }

        socket.on('chat_message', (data) => {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `<strong>${data.senderName}:</strong> ${data.text}`;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        // Голосовий ввід з червоним підсвічуванням мікрофона під час запису
        const micBtn = document.getElementById('micBtn');
        let isListening = false;
        
        micBtn.addEventListener('click', () => {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Ваш браузер не підтримує голосовий ввід.");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'uk-UA';

            if (!isListening) {
                recognition.start();
                isListening = true;
                micBtn.style.color = '#ef4444'; // Червоне підсвічування під час запису
            } else {
                recognition.stop();
                isListening = false;
                micBtn.style.color = '#94a3b8';
            }

            recognition.onresult = (event) => {
                const speechResult = event.results[0][0].transcript;
                messageInput.value = speechResult;
                isListening = false;
                micBtn.style.color = '#94a3b8';
            };

            recognition.onerror = () => {
                isListening = false;
                micBtn.style.color = '#94a3b8';
            };
        });
    </script>
</body>
</html>
