<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хабла 3.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background-color: #0b0f19; border-bottom: 1px solid #1f293d; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .menu-icon, .settings-icon { font-size: 20px; cursor: pointer; color: #00bcd4; }
        .chat-info h2 { font-size: 16px; font-weight: 600; }
        .chat-info span { font-size: 11px; color: #9ca3af; }
        .lang-select { background: transparent; border: 1px solid #00bcd4; color: #00bcd4; padding: 6px 12px; border-radius: 8px; font-size: 14px; outline: none; cursor: pointer; }
        .lang-select option { background-color: #0b0f19; color: #fff; }
        .lang-select option:disabled { color: #ff4c4c; font-style: italic; }
        .chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .message.user { align-self: flex-end; background-color: #162235; border: 1px solid #00bcd4; color: #ffffff; border-top-right-radius: 4px; }
        .message.bot { align-self: flex-start; background-color: #1f293d; color: #ffffff; border-top-left-radius: 4px; }
        .input-section { padding: 16px; background-color: #0b0f19; border-top: 1px solid #1f293d; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .text-input-wrapper { display: flex; align-items: center; width: 100%; border: 1px solid #00bcd4; border-radius: 14px; padding: 8px 12px; background-color: #111827; }
        .text-input-wrapper input { flex: 1; background: transparent; border: none; color: #ffffff; font-size: 14px; outline: none; }
        .text-input-wrapper input::placeholder { color: #6b7280; }
        .send-btn { background: transparent; border: none; color: #00bcd4; font-size: 18px; cursor: pointer; padding-left: 8px; }
        .mic-instruction { font-size: 12px; color: #9ca3af; }
        .mic-btn-container { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #00bcd4; display: flex; align-items: center; justify-content: center; background-color: #111827; cursor: pointer; box-shadow: 0 0 12px rgba(0, 188, 212, 0.3); }
        .mic-btn-container svg { width: 24px; height: 24px; fill: #00bcd4; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="menu-icon">☰</div>
            <div class="chat-info"><h2>Хабла 3.0</h2><span>STASAN</span></div>
        </div>
        <div>
            <select class="lang-select" id="langSelect">
                <option value="English">English</option>
                <option value="Spanish">Spanish</option>
                <option value="Ukrainian">Ukrainian</option>
                <option value="Russian" disabled>Russian (Агресор)</option>
            </select>
        </div>
        <div class="settings-icon">⚙️</div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message bot">Вітаю! Хабла 3.0 готова до роботи.</div>
    </div>

    <div class="input-section">
        <div class="text-input-wrapper">
            <input type="text" id="messageInput" placeholder="Enter text or microphone...">
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
        <div class="mic-instruction">Натисніть мікрофон для запису...</div>
        <div class="mic-btn-container" id="micBtn">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20h2v-3.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
        </div>
    </div>

    <script>
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatContainer = document.getElementById('chatContainer');
        const langSelect = document.getElementById('langSelect');
        const micBtn = document.getElementById('micBtn');

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            messageInput.value = '';

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, targetLanguage: langSelect.value })
                });

                const data = await response.json();
                if (response.ok) {
                    appendMessage(data.translatedText, 'bot');
                } else {
                    appendMessage('Помилка сервера при перекладі.', 'bot');
                }
            } catch (error) {
                appendMessage('Помилка зв’язку з сервером.', 'bot');
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        micBtn.addEventListener('click', () => { alert('Мікрофон активовано.'); });
    </script>
</body>
</html>
