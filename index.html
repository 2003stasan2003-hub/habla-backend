<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habla Mobile</title>
    <!-- Підключаємо Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #1f1f1f;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .header-left {
            display: flex;
            flex-direction: column;
        }
        h1 { margin: 0; font-size: 1.2rem; color: #00bcd4; }
        .subtitle { font-size: 0.85rem; color: #888; }
        
        /* Випадаючий список вибору мови у шапці */
        .language-select {
            background: #2c2c2c;
            color: #00bcd4;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        #online-users {
            padding: 8px 15px;
            background: #181818;
            font-size: 0.85rem;
            color: #00bcd4;
            border-bottom: 1px solid #282828;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .message.sent {
            background: #00838f;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            background: #272727;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        #input-container {
            display: flex;
            padding: 10px;
            background: #1f1f1f;
            border-top: 1px solid #333;
            gap: 10px;
            align-items: center;
        }
        input[type="text"] {
            flex: 1;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px 15px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #00bcd4;
        }
        .action-btn {
            background: #00bcd4;
            color: #121212;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mic-btn {
            background: #1f1f1f;
            border: 2px solid #00bcd4;
            color: #00bcd4;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .mic-btn:active, .action-btn:active { opacity: 0.8; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <h1>Habla Mobile</h1>
            <div class="subtitle" id="user-subtitle">Підключення...</div>
        </div>
        <select class="language-select" id="target-lang">
            <option value="Spanish">Spanish</option>
            <option value="English">English</option>
            <option value="German">German</option>
            <option value="Ukrainian">Ukrainian</option>
        </select>
    </header>

    <div id="online-users">Онлайн: очікування підключення...</div>

    <div id="chat-container">
        <!-- Сюди потраплятимуть повідомлення -->
    </div>

    <div id="input-container">
        <button class="mic-btn" id="mic-btn" title="Голосовий ввід">🎤</button>
        <input type="text" id="message-input" placeholder="Введіть текст або мікрофон...">
        <button class="action-btn" id="send-btn">&#10148;</button>
    </div>

    <script>
        const socket = io();

        let myNickname = prompt("Введіть ваш нікнейм:") || "Гість";
        document.getElementById('user-subtitle').innerText = myNickname;
        
        socket.emit('register', myNickname);

        socket.on('update-users', (users) => {
            const usersText = users.join(', ');
            document.getElementById('online-users').innerText = `Онлайн (${users.length}): ${usersText}`;
        });

        const inputField = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const chatContainer = document.getElementById('chat-container');
        const targetLangSelect = document.getElementById('target-lang');

        // Кнопка мікрофона активує поле вводу без зайвих діалогових вікон
        micBtn.addEventListener('click', () => {
            inputField.focus();
        });

        sendBtn.addEventListener('click', async () => {
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(`${myNickname}: ${text}`, 'sent');
            inputField.value = '';

            const targetLanguage = targetLangSelect ? targetLangSelect.value : 'Spanish';

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, targetLanguage })
                });
                const data = await response.json();
                if (data.translatedText) {
                    appendMessage(`[Переклад]: ${data.translatedText}`, 'received');
                } else if (data.error) {
                    appendMessage(`[Помилка]: ${data.error}`, 'received');
                }
            } catch (err) {
                console.error('Помилка перекладу:', err);
            }
        });

        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });

        function appendMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
