<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habla Messenger 3.0</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; background-color: #0b0f12; color: #ffffff; overflow: hidden; }
        
        .app-container { width: 100vw; height: 100vh; height: 100dvh; background-color: #121619; display: flex; overflow: hidden; position: relative; }
        
        /* ЛІВА КОЛОНКА (Список контактів) */
        .sidebar { width: 300px; background-color: #121619; border-right: 1px solid #1a2228; display: flex; flex-direction: column; flex-shrink: 0; z-index: 100; transition: transform 0.3s ease; }
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; background-color: #161b20; border-bottom: 1px solid #1a2228; }
        .sidebar-title { font-size: 16px; font-weight: bold; color: #00e5ff; }
        .add-contact-btn { background: #00e5ff; color: #121619; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }
        
        .contacts-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .contact-item { display: flex; align-items: center; background: #182026; border: 1px solid #1a2228; padding: 10px 12px; border-radius: 12px; cursor: pointer; transition: 0.2s; justify-content: space-between; }
        .contact-item:hover, .contact-item.active { border-color: #00e5ff; background: #1a222c; }
        .contact-left { display: flex; align-items: center; flex: 1; overflow: hidden; gap: 10px; }
        .contact-avatar { width: 42px; height: 42px; background: #00e5ff22; border: 1px solid #00e5ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #00e5ff; flex-shrink: 0; font-size: 15px; }
        .contact-info { overflow: hidden; }
        .contact-info h4 { font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .contact-info p { font-size: 11px; color: #8c9ba5; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .delete-contact { background: transparent; border: none; color: #ff4d4d; font-size: 15px; cursor: pointer; padding: 6px; }

        .empty-contacts { text-align: center; color: #8c9ba5; font-size: 13px; margin-top: 40px; padding: 0 20px; line-height: 1.5; }

        /* Затінення екрана під час відкриття меню на телефоні */
        .sidebar-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 90; }

        /* ПРАВА ЧАСТИНА (Область чату) */
        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #0b0f12; overflow: hidden; position: relative; }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; background-color: #121619; border-bottom: 1px solid #1a2228; flex-shrink: 0; gap: 10px; }
        .menu-btn { background: transparent; border: none; color: #00e5ff; font-size: 22px; cursor: pointer; display: none; padding: 0 5px; }
        .header-info { text-align: left; flex: 1; }
        .header-info h3 { font-size: 14px; font-weight: 600; }
        .header-info p { font-size: 11px; color: #8c9ba5; }
        
        .lang-select { background: #182026; color: #00e5ff; border: 1px solid #00e5ff55; padding: 4px 8px; border-radius: 8px; outline: none; font-size: 12px; max-width: 120px; }
        .settings-btn { background: transparent; border: none; color: #00e5ff; font-size: 18px; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
        
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .message.incoming { background-color: #182026; border: 1px solid #00e5ff44; align-self: flex-start; }
        .message.outgoing { background-color: #1a2228; border: 1px solid #00e5ff; align-self: flex-end; }
        
        .footer { padding: 10px 15px 20px 15px; background-color: #121619; border-top: 1px solid #1a2228; display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; }
        .input-box { width: 100%; display: flex; background: #182026; border: 1px solid #00e5ff; border-radius: 12px; padding: 6px 10px; align-items: center; }
        .input-box input { flex: 1; background: transparent; border: none; color: white; font-size: 14px; outline: none; }
        .send-btn { background: transparent; border: none; color: #00e5ff; font-size: 22px; cursor: pointer; padding: 10px; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
        
        .mic-container { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .mic-label { font-size: 11px; color: #8c9ba5; }
        .mic-btn { width: 50px; height: 50px; background: #182026; border: 2px solid #00e5ff; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 12px rgba(0, 229, 255, 0.3); }
        .mic-btn.recording { background: #00e5ff; }
        .mic-btn.recording .mic-icon { color: #121619; }
        .mic-icon { font-size: 20px; color: #00e5ff; }

        /* Мобільні стилі: робимо сайдбар виїзним меню */
        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; left: 0; top: 0; transform: translateX(-100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.active { display: block; }
            .menu-btn { display: block; }
        }
    </style>
</head>
<body>
    <!-- Модальне вікно для введення нікнейму власника -->
    <div id="nicknameModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#121619; padding:25px; border-radius:12px; width:90%; max-width:320px; text-align:center; border: 1px solid #00e5ff;">
            <h3 id="modalNickTitle" style="color:#fff; margin-bottom:15px;">Введіть ваш нікнейм</h3>
            <p id="modalNickDesc" style="color:#8c9ba5; font-size:13px; margin-bottom:20px;">Це необхідно для ідентифікації тестувальника.</p>
            <input type="text" id="nicknameInput" placeholder="Ваш нікнейм..." style="width:100%; padding:10px; border-radius:6px; border:1px solid #00e5ff55; background:#182026; color:#fff; font-size:16px; margin-bottom:15px; outline:none;">
            <button id="modalSaveBtn" onclick="saveNickname()" style="width:100%; padding:10px; background:#00e5ff; color:#121619; border:none; border-radius:6px; font-weight:bold; font-size:16px; cursor:pointer;">Зберегти</button>
        </div>
    </div>

    <!-- Модальне вікно: Додати абонента -->
    <div id="addContactModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#121619; padding:25px; border-radius:12px; width:90%; max-width:320px; text-align:center; border: 1px solid #00e5ff;">
            <h3 style="color:#fff; margin-bottom:15px;">Додати абонента</h3>
            <input type="text" id="newContactInput" placeholder="Нікнейм або ім'я (наприклад: Максим)..." style="width:100%; padding:10px; border-radius:6px; border:1px solid #00e5ff55; background:#182026; color:#fff; font-size:16px; margin-bottom:15px; outline:none;">
            <button onclick="saveNewContact()" style="width:100%; padding:10px; background:#00e5ff; color:#121619; border:none; border-radius:6px; font-weight:bold; font-size:16px; cursor:pointer; margin-bottom:10px;">Додати</button>
            <button onclick="closeAddContact()" style="width:100%; padding:8px; background:transparent; color:#8c9ba5; border:1px solid #333; border-radius:6px; font-size:14px; cursor:pointer;">Скасувати</button>
        </div>
    </div>

    <!-- Модальне вікно Налаштування (⚙️) -->
    <div id="settingsModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#121619; padding:25px; border-radius:12px; width:90%; max-width:320px; text-align:center; border: 1px solid #00e5ff;">
            <h3 id="settingsTitle" style="color:#fff; margin-bottom:15px;">⚙️ Налаштування</h3>
            <p id="settingsNickLabel" style="color:#8c9ba5; font-size:13px; margin-bottom:6px; text-align:left;">Змінити ваш нікнейм:</p>
            <input type="text" id="settingsNicknameInput" placeholder="Новий нікнейм..." style="width:100%; padding:10px; border-radius:6px; border:1px solid #00e5ff55; background:#182026; color:#fff; font-size:16px; margin-bottom:10px; outline:none;">
            <button id="settingsUpdateBtn" onclick="updateNickname()" style="width:100%; padding:9px; background:#00e5ff; color:#121619; border:none; border-radius:6px; font-weight:bold; font-size:14px; cursor:pointer; margin-bottom:15px;">Оновити нікнейм</button>

            <p id="settingsUiLangLabel" style="color:#8c9ba5; font-size:13px; margin-bottom:6px; text-align:left;">Мова інтерфейсу:</p>
            <select id="uiLangSelect" style="width:100%; padding:10px; border-radius:6px; border:1px solid #00e5ff55; background:#182026; color:#00e5ff; font-size:15px; margin-bottom:20px; outline:none;" onchange="handleUiLangChange(this)">
                <option value="Ukrainian">Українська</option>
                <option value="Spanish">Spanish</option>
                <option value="English">English</option>
                <option value="German">German</option>
                <option value="French">French</option>
                <option value="Italian">Italian</option>
                <option value="Georgian">Georgian</option>
                <option value="Japanese">Japanese</option>
                <option value="Russian">Russian</option>
            </select>
            <button id="settingsCloseBtn" onclick="closeSettings()" style="width:100%; padding:8px; background:transparent; color:#8c9ba5; border:1px solid #333; border-radius:6px; font-size:14px; cursor:pointer;">Закрити</button>
        </div>
    </div>

    <!-- Модальне вікно "Агресор" -->
    <div id="aggressorModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#121619; padding:25px; border-radius:12px; width:90%; max-width:320px; text-align:center; border: 1px solid #ff4d4d;">
            <h3 id="aggressorTitle" style="color:#ff4d4d; margin-bottom:15px;">Увага</h3>
            <p id="aggressorText" style="color:#fff; font-size:16px; font-weight:bold; margin-bottom:20px;">Агресор</p>
            <button id="aggressorOkBtn" onclick="closeAggressorModal()" style="width:100%; padding:10px; background:#ff4d4d; color:#fff; border:none; border-radius:6px; font-weight:bold; font-size:16px; cursor:pointer;">Зрозуміло</button>
        </div>
    </div>

    <!-- ОСНОВНИЙ ІНТЕРФЕЙС -->
    <div class="app-container">
        <!-- Затемнення фону при відкритті меню на телефоні -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>

        <!-- ЛІВА КОЛОНКА (на ПК видно завжди, на Android виїжджає по кнопці ☰) -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Habla Chats</span>
                <button class="add-contact-btn" onclick="openAddContact()">+ Додати</button>
            </div>
            <div class="contacts-list" id="contactsList">
                <!-- Контакти -->
            </div>
        </div>

        <!-- ПРАВА ЧАСТИНА (Область чату) -->
        <div class="chat-area" id="chatArea">
            <div class="header">
                <button class="menu-btn" onclick="toggleSidebar(true)">☰</button>
                <div class="header-info">
                    <h3 id="activeChatTitle">Виберіть чат</h3>
                    <p id="headerUser">STASAN</p>
                </div>
                <select id="targetLang" class="lang-select">
                    <option value="Ukrainian">Українська</option>
                    <option value="Spanish" selected>Spanish</option>
                    <option value="English">English</option>
                    <option value="German">German</option>
                    <option value="French">French</option>
                    <option value="Italian">Italian</option>
                    <option value="Georgian">Georgian</option>
                    <option value="Japanese">Japanese</option>
                    <option value="Russian">Russian</option>
                </select>
                <button class="settings-btn" onclick="openSettings()" title="Налаштування">⚙️</button>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message incoming">¡Hola! Selecciona un chat del menú (☰).</div>
            </div>

            <div class="footer">
                <div class="input-box">
                    <input type="text" id="userInput" placeholder="Введіть текст або мікрофон...">
                    <button class="send-btn" id="sendBtn" title="Надіслати">➤</button>
                </div>
                <div class="mic-container">
                    <span class="mic-label" id="micStatus">Натисніть мікрофон для запису...</span>
                    <button class="mic-btn" id="micBtn" title="Голосовий ввід"><span class="mic-icon">🎙</span></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://habla-backend-ipqk.onrender.com/api/translate";
        let isRecording = false, recognition = null;
        let lastValidLang = "Spanish"; 
        let lastValidUiLang = "Ukrainian";
        let activeContact = null;
        
        const inputField = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');
        const targetLang = document.getElementById('targetLang');
        const micBtn = document.getElementById('micBtn');
        const micStatus = document.getElementById('micStatus');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const contactsList = document.getElementById('contactsList');
        const activeChatTitle = document.getElementById('activeChatTitle');
        const headerUser = document.getElementById('headerUser');

        let contacts = JSON.parse(localStorage.getItem('habla_contacts')) || [];

        function saveContacts() {
            localStorage.setItem('habla_contacts', JSON.stringify(contacts));
        }

        function renderContacts() {
            contactsList.innerHTML = '';
            if (contacts.length === 0) {
                contactsList.innerHTML = `<div class="empty-contacts">Список абонентів порожній.<br>Натисніть <b>«+ Додати»</b>, щоб додати співрозмовника.</div>`;
                return;
            }
            contacts.forEach((contact, index) => {
                const initials = contact.name.substring(0, 2).toUpperCase();
                const item = document.createElement('div');
                item.className = `contact-item ${activeContact === contact.name ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="contact-left" onclick="selectContact('${contact.name}')">
                        <div class="contact-avatar">${initials}</div>
                        <div class="contact-info">
                            <h4>${contact.name}</h4>
                            <p>${contact.lastMessage || 'Натисніть для листування'}</p>
                        </div>
                    </div>
                    <button class="delete-contact" onclick="deleteContact(event, ${index})" title="Видалити">✕</button>
                `;
                contactsList.appendChild(item);
            });
        }

        function selectContact(name) {
            activeContact = name;
            activeChatTitle.innerText = name;
            renderContacts();
            // На мобільних пристроях ховаємо бокове меню при виборі чату
            if (window.innerWidth <= 768) {
                toggleSidebar(false);
            }
        }

        function toggleSidebar(show) {
            if (show) {
                sidebar.classList.add('open');
                sidebarOverlay.classList.add('active');
            } else {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('active');
            }
        }

        function openAddContact() {
            document.getElementById('newContactInput').value = '';
            document.getElementById('addContactModal').style.display = 'flex';
        }

        function closeAddContact() {
            document.getElementById('addContactModal').style.display = 'none';
        }

        function saveNewContact() {
            const name = document.getElementById('newContactInput').value.trim();
            if (!name) { alert('Введіть ім’я або нікнейм абонента'); return; }
            if (contacts.some(c => c.name === name)) { alert('Такий абонент уже є у списку'); return; }
            
            contacts.push({ name: name, lastMessage: "Новий чат" });
            saveContacts();
            renderContacts();
            closeAddContact();
            selectContact(name);
        }

        function deleteContact(event, index) {
            event.stopPropagation();
            if (confirm("Видалити цього абонента?")) {
                if (contacts[index].name === activeContact) {
                    activeContact = null;
                    activeChatTitle.innerText = "Виберіть чат";
                }
                contacts.splice(index, 1);
                saveContacts();
                renderContacts();
            }
        }

        const uiTexts = {
            Ukrainian: { nicknameTitle: "Введіть ваш нікнейм", nicknameDesc: "Це необхідно для ідентифікації тестувальника.", nicknamePlaceholder: "Ваш нікнейм...", saveBtn: "Зберегти", settingsTitle: "⚙️ Налаштування", nicknameLabel: "Змінити ваш нікнейм:", updateBtn: "Оновити нікнейм", uiLangLabel: "Мова інтерфейсу програми:", closeBtn: "Закрити", aggressorTitle: "Увага", aggressorText: "Агресор", aggressorOk: "Зрозуміло", userInputPlaceholder: "Введіть текст або мікрофон...", micStatusText: "Натисніть мікрофон для запису..." },
            Spanish: { nicknameTitle: "Introduce tu apodo", nicknameDesc: "Esto es necesario para la identificación del probador.", nicknamePlaceholder: "Tu apodo...", saveBtn: "Guardar", settingsTitle: "⚙️ Configuración", nicknameLabel: "Cambiar tu apodo:", updateBtn: "Actualizar apodo", uiLangLabel: "Idioma de la interfaz:", closeBtn: "Cerrar", aggressorTitle: "Atención", aggressorText: "Agresor", aggressorOk: "Entendido", userInputPlaceholder: "Introduce texto o micrófono...", micStatusText: "Haz clic en el micrófono para grabar..." },
            English: { nicknameTitle: "Enter your nickname", nicknameDesc: "This is required for tester identification.", nicknamePlaceholder: "Your nickname...", saveBtn: "Save", settingsTitle: "⚙️ Settings", nicknameLabel: "Change your nickname:", updateBtn: "Update nickname", uiLangLabel: "App Interface Language:", closeBtn: "Close", aggressorTitle: "Warning", aggressorText: "Aggressor", aggressorOk: "Understood", userInputPlaceholder: "Enter text or microphone...", micStatusText: "Click microphone to record..." },
            German: { nicknameTitle: "Geben Sie Ihren Spitznamen ein", nicknameDesc: "Dies ist für die Testeridentifizierung erforderlich.", nicknamePlaceholder: "Ihr Spitzname...", saveBtn: "Speichern", settingsTitle: "⚙️ Einstellungen", nicknameLabel: "Spitznamen ändern:", updateBtn: "Spitznamen aktualisieren", uiLangLabel: "App-Oberflächensprache:", closeBtn: "Schließen", aggressorTitle: "Achtung", aggressorText: "Aggressor", aggressorOk: "Verstanden", userInputPlaceholder: "Text oder Mikrofon eingeben...", micStatusText: "Klicken Sie auf das Mikrofon..." },
            French: { nicknameTitle: "Entrez votre pseudonyme", nicknameDesc: "Ceci est requis pour l'identification du testeur.", nicknamePlaceholder: "Votre pseudo...", saveBtn: "Enregistrer", settingsTitle: "⚙️ Paramètres", nicknameLabel: "Changer votre pseudo:", updateBtn: "Mettre à jour", uiLangLabel: "Langue de l'interface:", closeBtn: "Fermer", aggressorTitle: "Attention", aggressorText: "Agresseur", aggressorOk: "Compris", userInputPlaceholder: "Entrez du texte ou micro...", micStatusText: "Cliquez sur le micro pour enregistrer..." },
            Italian: { nicknameTitle: "Inserisci il tuo nickname", nicknameDesc: "Questo è necessario per l'identificazione del tester.", nicknamePlaceholder: "Il tuo nickname...", saveBtn: "Salva", settingsTitle: "⚙️ Impostazioni", nicknameLabel: "Modifica nickname:", updateBtn: "Aggiorna nickname", uiLangLabel: "Lingua dell'interfaccia:", closeBtn: "Chiudi", aggressorTitle: "Attenzione", aggressorText: "Aggressore", aggressorOk: "Capito", userInputPlaceholder: "Inserisci testo o microfono...", micStatusText: "Clicca sul microfono per registrare..." },
            Georgian: { nicknameTitle: "შეyванet tqveni metsaxeli", nicknameDesc: "es aucilebelia testirebistvis.", nicknamePlaceholder: "tqveni metsaxeli...", saveBtn: "shenaxva", settingsTitle: "⚙️ paraleluri", nicknameLabel: "metsaxelis shecvla:", updateBtn: "ganaxleba", uiLangLabel: "interfeisis ena:", closeBtn: "daxurva", aggressorTitle: "yuradgeba", aggressorText: "agresi", aggressorOk: "gasagebia", userInputPlaceholder: "sheiyvane teqsti...", micStatusText: "daakipet mikrofonts..." },
            Japanese: { nicknameTitle: "ニックネームを入力してください", nicknameDesc: "テスターの識別のために必要です。", nicknamePlaceholder: "ニックネーム...", saveBtn: "保存", settingsTitle: "⚙️ 設定", nicknameLabel: "ニックネームを変更:", updateBtn: "更新", uiLangLabel: "アプリの言語:", closeBtn: "閉じる", aggressorTitle: "警告", aggressorText: "アグレッサー", aggressorOk: "了解", userInputPlaceholder: "テキストを入力...", micStatusText: "マイクをクリック..." },
            Russian: { nicknameTitle: "Введите ваш никнейм", nicknameDesc: "Это необходимо для идентификации тестувальника.", nicknamePlaceholder: "Ваш никнейм...", saveBtn: "Сохранить", settingsTitle: "⚙️ Настройки", nicknameLabel: "Изменить ваш никнейм:", updateBtn: "Обновить никнейм", uiLangLabel: "Язык интерфейса приложения:", closeBtn: "Закрыть", aggressorTitle: "Внимание", aggressorText: "Агрессор", aggressorOk: "Понятно", userInputPlaceholder: "Введите текст или микрофон...", micStatusText: "Нажмите микрофон для записи..." }
        };

        function changeUiLang(lang) {
            localStorage.setItem('habla_ui_lang', lang);
            const t = uiTexts[lang] || uiTexts.Ukrainian;
            document.getElementById('modalNickTitle').innerText = t.nicknameTitle;
            document.getElementById('modalNickDesc').innerText = t.nicknameDesc;
            document.getElementById('nicknameInput').placeholder = t.nicknamePlaceholder;
            document.getElementById('modalSaveBtn').innerText = t.saveBtn;
            document.getElementById('settingsTitle').innerText = t.settingsTitle;
            document.getElementById('settingsNickLabel').innerText = t.nicknameLabel;
            document.getElementById('settingsUpdateBtn').innerText = t.updateBtn;
            document.getElementById('settingsUiLangLabel').innerText = t.uiLangLabel;
            document.getElementById('settingsCloseBtn').innerText = t.closeBtn;
            document.getElementById('aggressorTitle').innerText = t.aggressorTitle;
            document.getElementById('aggressorText').innerText = t.aggressorText;
            document.getElementById('aggressorOkBtn').innerText = t.aggressorOk;
            inputField.placeholder = t.userInputPlaceholder;
            micStatus.innerText = t.micStatusText;
        }

        function handleUiLangChange(selectElement) {
            const val = selectElement.value;
            if (val === 'Russian') {
                selectElement.value = lastValidUiLang;
                document.getElementById('aggressorModal').style.display = 'flex';
            } else {
                lastValidUiLang = val;
                changeUiLang(val);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedNickname = localStorage.getItem('habla_nickname');
            const savedUiLang = localStorage.getItem('habla_ui_lang') || 'Ukrainian';
            lastValidUiLang = savedUiLang;
            document.getElementById('uiLangSelect').value = savedUiLang;
            changeUiLang(savedUiLang);

            if (!savedNickname) {
                document.getElementById('nicknameModal').style.display = 'flex';
            } else {
                headerUser.innerText = savedNickname;
            }
            renderContacts();
        });

        function saveNickname() {
            const nickname = document.getElementById('nicknameInput').value.trim();
            if (nickname.length < 2) { alert('Введіть мінімум 2 символи'); return; }
            localStorage.setItem('habla_nickname', nickname);
            document.getElementById('nicknameModal').style.display = 'none';
            headerUser.innerText = nickname;
        }

        function openSettings() {
            document.getElementById('settingsNicknameInput').value = localStorage.getItem('habla_nickname') || '';
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

        function updateNickname() {
            const nickname = document.getElementById('settingsNicknameInput').value.trim();
            if (nickname.length < 2) { alert('Введіть мінімум 2 символи'); return; }
            localStorage.setItem('habla_nickname', nickname);
            headerUser.innerText = nickname;
            closeSettings();
        }

        targetLang.addEventListener('change', (e) => {
            if (e.target.value === 'Russian') {
                e.target.value = lastValidLang;
                document.getElementById('aggressorModal').style.display = 'flex';
            } else {
                lastValidLang = e.target.value;
            }
        });

        function closeAggressorModal() { document.getElementById('aggressorModal').style.display = 'none'; }

        async function sendMessage() {
            if (!activeContact) {
                alert("Будь ласка, натисніть кнопку меню (☰) зліва вгорі та виберіть абонента!");
                return;
            }
            const text = inputField.value.trim();
            const lang = targetLang.value;
            if (!text) return;
            
            appendMessage(text, 'outgoing');
            inputField.value = '';

            const loadingId = appendMessage("Переклад...", 'incoming');

            try {
                const response = await fetch(BACKEND_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ text: text, targetLanguage: lang }) 
                });
                loadingId.remove();
                if (response.ok) {
                    const data = await response.json();
                    appendMessage(data.translatedText, 'incoming');
                    const found = contacts.find(c => c.name === activeContact);
                    if (found) {
                        found.lastMessage = data.translatedText;
                        saveContacts();
                        renderContacts();
                    }
                } else { 
                    appendMessage("Помилка сервера при перекладі.", 'incoming'); 
                }
            } catch (err) {
                loadingId.remove();
                appendMessage("Помилка з'єднання з сервером.", 'incoming');
            }
        }

        function appendMessage(text, type) {
            const msgDiv = document.createElement('div'); 
            msgDiv.className = `message ${type}`; 
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv); 
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return msgDiv;
        }

        sendBtn.addEventListener('click', (e) => { e.preventDefault(); sendMessage(); });
        inputField.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition(); 
            recognition.continuous = true; 
            recognition.interimResults = true;
            recognition.onresult = e => {
                let t = ''; 
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    t += e.results[i][0].transcript;
                }
                inputField.value = t;
            };
            recognition.onerror = () => stopRec(); 
            recognition.onend = () => stopRec();
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) { alert("Використовуйте Google Chrome."); return; }
            if (!isRecording) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(stream => {
                        stream.getTracks().forEach(track => track.stop());
                        recognition.lang = 'uk-UA';
                        recognition.start(); 
                        isRecording = true; 
                        micBtn.classList.add('recording');
                        micStatus.innerText = "Йде запис... Говоріть.";
                    })
                    .catch(() => alert("Доступ до мікрофона заблоковано системою."));
            } else { 
                recognition.stop(); 
                stopRec(); 
            }
        });

        function stopRec() {
            isRecording = false; 
            micBtn.classList.remove('recording');
            micStatus.innerText = "Натисніть мікрофон для запису...";
        }
    </script>
</body>
</html>
