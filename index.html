<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habla Mobile 3.0</title>
    <!-- Підключення PWA маніфесту для встановлення -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00ffcc">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0e15;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        header {
            background: #151823;
            border-bottom: 1px solid #2a2f45;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 255, 204, 0.05);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #00ffcc;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .menu-btn:hover {
            background: rgba(0, 255, 204, 0.1);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
            letter-spacing: 0.5px;
        }

        .online-status {
            font-size: 0.85rem;
            color: #a0a5c0;
            background: #1e2233;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid #2f3552;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .online-status:hover {
            border-color: #00ffcc;
        }

        .lang-panel {
            background: #121520;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #1f2438;
            font-size: 0.9rem;
        }

        .lang-panel label {
            color: #8a91b4;
        }

        .lang-select {
            background: #1a1e2e;
            color: #00ffcc;
            border: 1px solid #2f3552;
            padding: 6px 12px;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* ГОРИЗОНТАЛЬНА СТРІЧКА КОНТАКТІВ ЗВЕРХУ */
        .top-contacts-strip {
            background: #151823;
            border-bottom: 1px solid #2f3552;
            padding: 8px 12px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }
        .top-contacts-strip::-webkit-scrollbar {
            display: none;
        }

        .contact-pill {
            background: #1a1e2e;
            border: 1px solid #2f3552;
            color: #e0e0e0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .contact-pill:hover {
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.05);
        }

        .contact-pill.active {
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.15);
            color: #00ffcc;
            font-weight: bold;
        }

        .pill-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0056b3 0%, #00ffcc 100%);
            color: #fff;
            font-weight: bold;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pill-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }
        .pill-dot.online { background-color: #00ffcc; box-shadow: 0 0 5px #00ffcc; }
        .pill-dot.offline { background-color: #ff3b30; }

        .side-menu {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #121520;
            border-right: 1px solid #2a2f45;
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5);
            z-index: 100;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            overflow-y: auto;
        }

        .side-menu.open {
            left: 0;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2438;
            padding-bottom: 12px;
        }

        .menu-title {
            color: #00ffcc;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .close-menu-btn {
            background: none;
            border: none;
            color: #a0a5c0;
            font-size: 1.3rem;
            cursor: pointer;
        }

        .menu-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .menu-section label {
            font-size: 0.85rem;
            color: #8a91b4;
        }

        .user-badge-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1a1e2e;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #2f3552;
        }

        .user-avatar-large {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ffcc 0%, #7928ca 100%);
            color: #0d0e15;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .user-badge {
            color: #00ffcc;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .add-contact-box {
            display: flex;
            gap: 6px;
        }

        .add-contact-input {
            flex: 1;
            background: #1a1e2e;
            border: 1px solid #2f3552;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        .add-contact-btn {
            background: #00ffcc;
            color: #0d0e15;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .menu-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 99;
            display: none;
        }

        .menu-overlay.active {
            display: block;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: radial-gradient(circle at center, #111422 0%, #0d0e15 100%);
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.incoming {
            background: #1a1e2e;
            color: #e0e0e0;
            align-self: flex-start;
            border-left: 3px solid #7928ca;
        }

        .message.outgoing {
            background: #0056b3;
            color: #fff;
            align-self: flex-end;
            border-right: 3px solid #00ffcc;
        }

        .message.private {
            border: 1px dashed #00ffcc;
        }

        .message .author {
            font-size: 0.75rem;
            color: #a0a5c0;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .msg-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
        }

        .speak-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            opacity: 0.7;
            transition: opacity 0.2s, transform 0.2s;
            padding: 2px 4px;
        }

        .speak-btn:hover {
            opacity: 1;
            transform: scale(1.15);
        }

        .input-container {
            background: #151823;
            padding: 12px 16px;
            border-top: 1px solid #2a2f45;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        #message-input {
            width: 100%;
            background: #1a1e2e;
            border: 1px solid #2f3552;
            color: #fff;
            padding: 12px 45px 12px 16px;
            border-radius: 24px;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        #message-input:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 8px rgba(0, 255, 204, 0.2);
        }

        .mic-button {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }

        .mic-button:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.1);
        }

        .mic-button.listening {
            background-color: rgba(255, 59, 48, 0.2) !important;
            box-shadow: 0 0 12px #ff3b30;
            animation: pulseMic 1.5s infinite;
        }

        @keyframes pulseMic {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .send-button {
            background: linear-gradient(135deg, #00ffcc 0%, #00b894 100%);
            color: #0d0e15;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }

        .send-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button id="menu-btn" class="menu-btn" title="Menu">☰</button>
            <div class="logo">Habla Mobile 3.0</div>
        </div>
        <div id="online-count" class="online-status" title="Ver lista">En línea: 1</div>
    </header>

    <div class="lang-panel">
        <label for="target-lang" id="label-translate-to">Traducir a:</label>
        <select id="target-lang" class="lang-select">
            <option value="English">English</option>
            <option value="Spanish" selected>Spanish</option>
            <option value="Ukrainian">Ukrainian</option>
            <option value="German">German</option>
            <option value="French">French</option>
        </select>
    </div>

    <!-- ГОРИЗОНТАЛЬНА СТРІЧКА КОНТАКТІВ ЗВЕРХУ -->
    <div id="top-contacts-strip" class="top-contacts-strip">
        <span style="color: #8a91b4; font-size: 0.85rem; padding: 4px;">Cargando...</span>
    </div>

    <div id="menu-overlay" class="menu-overlay"></div>

    <div id="side-menu" class="side-menu">
        <div class="menu-header">
            <span class="menu-title" id="menu-title-text">Configuración</span>
            <button id="close-menu-btn" class="close-menu-btn">✕</button>
        </div>

        <div class="menu-section">
            <label id="label-profile">Tu perfil</label>
            <div class="user-badge-container">
                <div id="user-avatar-large" class="user-avatar-large">G</div>
                <div id="user-display" class="user-badge">Invitado</div>
            </div>
        </div>

        <!-- Двостовпчиковий індикатор лімітів Groq API -->
        <div class="menu-section">
            <label id="label-api-status">Estado API Groq</label>
            <div style="display: flex; gap: 8px;">
                <div id="req-box" style="flex: 1; background: #1a1e2e; padding: 8px; border-radius: 8px; border: 1px solid #2f3552; text-align: center; transition: border-color 0.3s, box-shadow 0.3s;">
                    <div style="font-size: 0.7rem; color: #8a91b4; margin-bottom: 2px;">REQS</div>
                    <div id="req-value" style="font-size: 0.95rem; font-weight: bold; color: #00ffcc;">---</div>
                </div>
                <div id="tok-box" style="flex: 1; background: #1a1e2e; padding: 8px; border-radius: 8px; border: 1px solid #2f3552; text-align: center; transition: border-color 0.3s, box-shadow 0.3s;">
                    <div style="font-size: 0.7rem; color: #8a91b4; margin-bottom: 2px;">TOKENS</div>
                    <div id="tok-value" style="font-size: 0.95rem; font-weight: bold; color: #00ffcc;">---</div>
                </div>
            </div>
        </div>

        <!-- БЛОК ПОШИРЕННЯ: Кнопка «Поділитися» без дужок + QR-код -->
        <div class="menu-section">
            <label id="label-share-app">Instalar / Compartir App</label>
            <div style="background: #1a1e2e; padding: 10px; border-radius: 8px; border: 1px solid #2f3552; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center;">
                <img id="qr-code-img" src="" alt="QR Code" style="width: 110px; height: 110px; background: #fff; padding: 4px; border-radius: 6px;">
                <div id="app-url-text" style="font-size: 0.75rem; color: #8a91b4; word-break: break-all;">---</div>
                <button id="native-share-btn" style="background: linear-gradient(135deg, #00ffcc 0%, #00b894 100%); color: #0d0e15; border: none; padding: 8px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem; width: 100%;">
                    📤 Поділитися
                </button>
                <button id="copy-link-btn" style="background: #2f3552; color: #00ffcc; border: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem; width: 100%;">
                    📋 Копіювати посилання
                </button>
            </div>
        </div>

        <!-- ДОДАВАННЯ НОВОГО КОНТАКТУ -->
        <div class="menu-section">
            <label id="label-online-users">Contactos / Usuarios</label>
            <div class="add-contact-box">
                <input type="text" id="new-contact-input" class="add-contact-input" placeholder="Añadir por apodo...">
                <button id="add-contact-btn" class="add-contact-btn">Añadir</button>
            </div>
        </div>

        <div class="menu-section">
            <label for="interface-lang" id="label-interface-lang">Idioma de la interfaz:</label>
            <select id="interface-lang" class="lang-select">
                <option value="Spanish">Spanish</option>
                <option value="English">English</option>
                <option value="Ukrainian">Ukrainian</option>
                <option value="German">German</option>
                <option value="French">French</option>
            </select>
        </div>

        <div class="menu-section">
            <label id="label-voice-over">Locución de traducción</label>
            <div class="toggle-container">
                <span id="label-enable-sound" style="font-size: 0.9rem; color: #e0e0e0;">Activar sonido</span>
                <label class="switch">
                    <input type="checkbox" id="sound-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <div id="chat-messages"></div>

    <div class="input-container">
        <div class="input-wrapper">
            <input type="text" id="message-input" placeholder="Escribe un mensaje o habla..." autocomplete="off">
            <button id="mic-btn" class="mic-button" title="Entrada de voz">🎤</button>
        </div>
        <button id="send-btn" class="send-button" title="Enviar">➤</button>
    </div>

    <script>
        const socket = io();

        let selectedRecipientName = null;
        let recentContactsOrder = JSON.parse(localStorage.getItem('habla_recent_contacts') || '[]');
        // Зберігаємо додані локально користувачі, щоб вони одразу відображалися у стрічці
        let localAddedContacts = JSON.parse(localStorage.getItem('habla_local_contacts') || '[]');

        let username = localStorage.getItem('habla_username');
        if (!username) {
            username = prompt("Introduce tu apodo / Introduce your nickname:") || "Invitado";
            username = username.trim();
            localStorage.setItem('habla_username', username);
        }

        const currentAppUrl = window.location.origin;
        document.getElementById('app-url-text').textContent = currentAppUrl;
        document.getElementById('qr-code-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentAppUrl)}`;

        document.getElementById('native-share-btn').addEventListener('click', async () => {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Habla Mobile 3.0',
                        text: 'Приєднуйся до мого месенджера Habla Mobile!',
                        url: currentAppUrl
                    });
                } catch (err) {
                    console.log('Поширення скасовано', err);
                }
            } else {
                navigator.clipboard.writeText(currentAppUrl);
                alert('Посилання скопійовано в буфер обміну!');
            }
        });

        document.getElementById('copy-link-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(currentAppUrl).then(() => {
                alert('¡Enlace copiado / Посилання скопійовано!');
            }).catch(err => {
                console.error('Помилка копіювання:', err);
            });
        });

        let availableVoices = [];
        function populateVoiceList() {
            if (typeof speechSynthesis === 'undefined') return;
            availableVoices = speechSynthesis.getVoices();
        }
        populateVoiceList();
        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        const ttsLangMap = {
            'Ukrainian': 'uk-UA',
            'English': 'en-US',
            'Spanish': 'es-ES',
            'German': 'de-DE',
            'French': 'fr-FR'
        };

        function speakText(textToSpeech) {
            if (!('speechSynthesis' in window)) return;
            const utterance = new SpeechSynthesisUtterance(textToSpeech);
            const selectedLangCode = ttsLangMap[targetLangSelect.value] || 'es-ES';
            utterance.lang = selectedLangCode;
            
            if (availableVoices.length > 0) {
                const langVoices = availableVoices.filter(v => v.lang.startsWith(selectedLangCode.split('-')[0]));
                if (langVoices.length > 0) {
                    const bestVoice = langVoices.find(v => v.name.includes('Google') || v.name.includes('Microsoft') || v.name.includes('Natural')) || langVoices[0];
                    utterance.voice = bestVoice;
                }
            }
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        };

        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const chatMessages = document.getElementById('chat-messages');
        const targetLangSelect = document.getElementById('target-lang');
        const interfaceLangSelect = document.getElementById('interface-lang');
        const onlineCount = document.getElementById('online-count');
        const micBtn = document.getElementById('mic-btn');
        
        const menuBtn = document.getElementById('menu-btn');
        const closeMenuBtn = document.getElementById('close-menu-btn');
        const sideMenu = document.getElementById('side-menu');
        const menuOverlay = document.getElementById('menu-overlay');
        const userDisplay = document.getElementById('user-display');
        const userAvatarLarge = document.getElementById('user-avatar-large');
        const topContactsStrip = document.getElementById('top-contacts-strip');
        const soundToggle = document.getElementById('sound-toggle');

        const newContactInput = document.getElementById('new-contact-input');
        const addContactBtn = document.getElementById('add-contact-btn');

        const labelTranslateTo = document.getElementById('label-translate-to');
        const menuTitleText = document.getElementById('menu-title-text');
        const labelProfile = document.getElementById('label-profile');
        const labelOnlineUsers = document.getElementById('label-online-users');
        const labelInterfaceLang = document.getElementById('label-interface-lang');
        const labelVoiceOver = document.getElementById('label-voice-over');
        const labelEnableSound = document.getElementById('label-enable-sound');
        const labelApiStatus = document.getElementById('label-api-status');
        const labelShareApp = document.getElementById('label-share-app');
        const nativeShareBtn = document.getElementById('native-share-btn');
        const copyLinkBtn = document.getElementById('copy-link-btn');

        let currentOnlineCount = 1;
        let lastUsersData = [];
        let lastIsAdmin = false;

        let savedInterfaceLang = localStorage.getItem('habla_interface_lang') || 'Spanish';
        interfaceLangSelect.value = savedInterfaceLang;

        function updateInterfaceTexts() {
            const lang = interfaceLangSelect.value;
            const t = translations[lang] || translations.Spanish;

            menuTitleText.textContent = t.settings;
            labelProfile.textContent = t.profile;
            labelOnlineUsers.textContent = t.onlineUsersTitle;
            labelInterfaceLang.textContent = t.interfaceLang;
            labelVoiceOver.textContent = t.voiceOver;
            labelEnableSound.textContent = t.enableSound;
            labelTranslateTo.textContent = t.translateTo;
            labelApiStatus.textContent = t.apiStatus;
            labelShareApp.textContent = t.shareApp;
            nativeShareBtn.textContent = t.nativeShare;
            copyLinkBtn.textContent = t.copyLink;
            messageInput.placeholder = t.placeholder;
            newContactInput.placeholder = t.addPlaceholder;
            addContactBtn.textContent = t.addBtn;
            onlineCount.textContent = `${t.online}: ${currentOnlineCount}`;

            renderTopContacts(lastUsersData, lastIsAdmin);
        }

        interfaceLangSelect.addEventListener('change', () => {
            localStorage.setItem('habla_interface_lang', interfaceLangSelect.value);
            updateInterfaceTexts();
        });

        updateInterfaceTexts();

        userDisplay.textContent = username;
        userAvatarLarge.textContent = username.charAt(0).toUpperCase();
        socket.emit('join', username);

        function openMenu() {
            sideMenu.classList.add('open');
            menuOverlay.classList.add('active');
        }

        function closeMenu() {
            sideMenu.classList.remove('open');
            menuOverlay.classList.remove('active');
        }

        menuBtn.addEventListener('click', openMenu);
        onlineCount.addEventListener('click', openMenu);
        closeMenuBtn.addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', closeMenu);

        // Додавання контакту вручну з миттєвим відображенням у стрічці зверху
        addContactBtn.addEventListener('click', () => {
            const targetName = newContactInput.value.trim();
            if (targetName && targetName !== username) {
                socket.emit('add-contact', targetName);
                
                // Зберігаємо локально, щоб одразу бачити у верхній стрічці
                if (!localAddedContacts.includes(targetName)) {
                    localAddedContacts.push(targetName);
                    localStorage.setItem('habla_local_contacts', JSON.stringify(localAddedContacts));
                }

                newContactInput.value = '';
                renderTopContacts(lastUsersData, lastIsAdmin);
            }
        });

        newContactInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addContactBtn.click();
            }
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            const targetLang = targetLangSelect.value;

            socket.emit('chatMessage', {
                text: text,
                targetLang: targetLang,
                user: username,
                recipientName: selectedRecipientName
            });

            messageInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        socket.on('chatMessage', (data) => {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            
            const isSelf = data.user === username;
            messageDiv.classList.add(isSelf ? 'outgoing' : 'incoming');
            if (data.isPrivate) {
                messageDiv.classList.add('private');
            }

            let authorLabel = escapeHtml(data.user);
            if (data.isPrivate) {
                authorLabel += ` 🔒 (Privado)`;
            }

            let htmlContent = `<div class="author"><span>${authorLabel}</span></div>`;
            htmlContent += `<div>${escapeHtml(data.text)}</div>`;
            htmlContent += `
                <div class="msg-footer">
                    <button class="speak-btn" title="Escuchar / Озвучити">🔊</button>
                </div>
            `;

            messageDiv.innerHTML = htmlContent;

            const speakBtn = messageDiv.querySelector('.speak-btn');
            speakBtn.addEventListener('click', () => {
                speakText(data.text);
            });

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            if (soundToggle.checked) {
                speakText(data.text);
            }
        });

        socket.on('groq-limits', (limits) => {
            const reqVal = parseInt(limits.requests, 10);
            const tokVal = parseInt(limits.tokens, 10);

            const reqBox = document.getElementById('req-box');
            const reqElem = document.getElementById('req-value');
            const tokBox = document.getElementById('tok-box');
            const tokElem = document.getElementById('tok-value');

            if (reqElem && !isNaN(reqVal)) {
                reqElem.textContent = reqVal;
                if (reqVal > 300) {
                    reqBox.style.borderColor = '#00ffcc';
                    reqBox.style.boxShadow = '0 0 8px rgba(0, 255, 204, 0.2)';
                    reqElem.style.color = '#00ffcc';
                } else if (reqVal >= 100) {
                    reqBox.style.borderColor = '#ffcc00';
                    reqBox.style.boxShadow = '0 0 8px rgba(255, 204, 0, 0.2)';
                    reqElem.style.color = '#ffcc00';
                } else {
                    reqBox.style.borderColor = '#ff3b30';
                    reqBox.style.boxShadow = '0 0 8px rgba(255, 59, 48, 0.3)';
                    reqElem.style.color = '#ff3b30';
                }
            }

            if (tokElem && !isNaN(tokVal)) {
                tokElem.textContent = tokVal;
                if (tokVal > 20000) {
                    tokBox.style.borderColor = '#00ffcc';
                    tokBox.style.boxShadow = '0 0 8px rgba(0, 255, 204, 0.2)';
                    tokElem.style.color = '#00ffcc';
                } else if (tokVal >= 5000) {
                    tokBox.style.borderColor = '#ffcc00';
                    tokBox.style.boxShadow = '0 0 8px rgba(255, 204, 0, 0.2)';
                    tokElem.style.color = '#ffcc00';
                } else {
                    tokBox.style.borderColor = '#ff3b30';
                    tokBox.style.boxShadow = '0 0 8px rgba(255, 59, 48, 0.3)';
                    tokElem.style.color = '#ff3b30';
                }
            }
        });

        socket.on('onlineCount', (count) => {
            currentOnlineCount = count;
            const lang = interfaceLangSelect.value;
            const t = translations[lang] || translations.Spanish;
            onlineCount.textContent = `${t.online}: ${count}`;
        });

        socket.on('update-users', ({ users, isAdmin }) => {
            lastUsersData = users;
            lastIsAdmin = isAdmin;
            renderTopContacts(users, isAdmin);
        });

        function renderTopContacts(users, isAdmin) {
            topContactsStrip.innerHTML = '';
            const lang = interfaceLangSelect.value;
            const t = translations[lang] || translations.Spanish;

            // Об'єднуємо список із сервера та локально додані контакти
            let allNamesMap = new Map();
            users.forEach(u => allNamesMap.set(u.name, u));
            localAddedContacts.forEach(name => {
                if (!allNamesMap.has(name)) {
                    allNamesMap.set(name, { name: name, isOnline: false, myAdd: true, theirAdd: false, isMutual: false });
                }
            });

            let combinedUsers = Array.from(allNamesMap.values());

            if (combinedUsers.length === 0) {
                topContactsStrip.innerHTML = `<span style="color: #8a91b4; font-size: 0.85rem; padding: 4px;">${t.noContacts}</span>`;
                return;
            }

            // Сортування: вибраний або останній нещодавній іде на перше місце
            combinedUsers.sort((a, b) => {
                const indexA = recentContactsOrder.indexOf(a.name);
                const indexB = recentContactsOrder.indexOf(b.name);
                if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                if (indexA !== -1) return -1;
                if (indexB !== -1) return 1;
                return 0;
            });

            combinedUsers.forEach(user => {
                const pill = document.createElement('div');
                pill.classList.add('contact-pill');
                if (selectedRecipientName === user.name) {
                    pill.classList.add('active');
                }

                const firstLetter = user.name.charAt(0).toUpperCase();
                let statusBadgeText = '';
                if (isAdmin) {
                    statusBadgeText = user.isMutual ? ' ⭐' : (user.myAdd ? ' ⏳' : '');
                }

                pill.innerHTML = `
                    <div class="pill-avatar">${firstLetter}</div>
                    <span>${escapeHtml(user.name)}${statusBadgeText}</span>
                    <div class="pill-dot ${user.isOnline ? 'online' : 'offline'}"></div>
                `;

                // Клік по контакту: обираємо людину для приватної розмови та підіймаємо на перше місце
                pill.addEventListener('click', () => {
                    selectedRecipientName = user.name;

                    recentContactsOrder = recentContactsOrder.filter(n => n !== user.name);
                    recentContactsOrder.unshift(user.name);
                    localStorage.setItem('habla_recent_contacts', JSON.stringify(recentContactsOrder));

                    renderTopContacts(lastUsersData, lastIsAdmin);
                });

                topContactsStrip.appendChild(pill);
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            micBtn.style.display = 'none';
        } else {
            const recognition = new SpeechRecognition();
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            let isListening = false;

            micBtn.addEventListener('click', () => {
                if (isListening) {
                    recognition.stop();
                    return;
                }
                
                const currentInterfaceLang = interfaceLangSelect.value;
                recognition.lang = ttsLangMap[currentInterfaceLang] || 'es-ES';

                try {
                    recognition.start();
                } catch (e) {
                    console.error("Error:", e);
                }
            });

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                micBtn.textContent = "🔴";
            };

            recognition.onresult = (event) => {
                const speechText = event.results[0][0].transcript;
                messageInput.value += (messageInput.value ? ' ' : '') + speechText;
            };

            recognition.onerror = () => {
                stopListeningState();
            };

            recognition.onend = () => {
                stopListeningState();
            };

            function stopListeningState() {
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.textContent = "🎤";
            }
        }
    </script>
</body>
</html>
