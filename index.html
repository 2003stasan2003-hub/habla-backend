<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habla - Вибір версії додатку</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0b0f12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #121619;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #1a2228;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            max-width: 450px;
            width: 90%;
        }
        h1 {
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #8c9ba5;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .download-btn {
            background: #182026;
            color: #00e5ff;
            border: 2px solid #00e5ff;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: block;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
        }
        .download-btn:hover {
            background: #00e5ff;
            color: #121619;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.4);
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Habla Messenger</h1>
        <p>Оберіть версію для вашого пристрою:</p>
        <div class="btn-group">
            <a href="desktop.html" class="download-btn">💻 Версія для ПК (Desktop)</a>
            <a href="mobile.html" class="download-btn">📱 Версія для Android (Мобільна)</a>
        </div>
    </div>
</body>
</html>
