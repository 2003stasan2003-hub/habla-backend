<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubble Mobile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #121212; color: #ffffff; }

        /* Верхня панель (Header) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #1e1e1e;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Кнопка гамбургер (три рисочки) */
        .menu-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
        }

        .app-title {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Селектор мов */
        .language-select {
            background-color: #2c2c2c;
            color: #ffffff;
            border: 1px solid #444;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        /* Бокове меню (Sidebar) */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: #181818;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            transition: left 0.3s ease;
            z-index: 1000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
        }

        /* Кнопка Додати */
        .add-user-btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .add-user-btn:hover {
            background-color: #005ec4;
        }

        /* Затемнення фону при відкритому меню */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <!-- Шапка додатку -->
    <header class="header">
        <div class="header-left">
            <button class="menu-btn" id="menuToggle">&#9776;</button>
            <span class="app-title">Hubble Mobile</span>
        </div>

        <!-- Випадаючий список мов із вашим переліком -->
        <select class="language-select" id="langSelect">
            <option value="en-US">🇺🇸 Сполучені Штати (English)</option>
            <option value="en-GB">🇬🇧 Велика Британія (English)</option>
            <option value="de-DE">🇩🇪 Німеччина (Deutsch)</option>
            <option value="pl-PL">🇵🇱 Польща (Polski)</option>
            <option value="et-EE">🇪🇪 Естонія (Eesti)</option>
            <option value="lv-LV">🇱🇻 Латвія (Latviešu)</option>
            <option value="lt-LT">🇱🇹 Литва (Lietuvių)</option>
            <option value="cs-CZ">🇨🇿 Чехія (Čeština)</option>
            <option value="nl-NL">🇳🇱 Нідерланди (Nederlands)</option>
            <option value="da-DK">🇩🇰 Данія (Dansk)</option>
            <option value="en-CA">🇨🇦 Канада (English/Français)</option>
            <option value="nb-NO">🇳🇴 Норвегія (Norsk)</option>
            <option value="fr-FR">🇫🇷 Франція (Français)</option>
            <option value="sv-SE">🇸🇪 Швеція (Svenska)</option>
            <option value="fi-FI">🇫🇮 Фінляндія (Suomi)</option>
            <option value="ru-RU">🇷🇺 Росія (Русский)</option>
        </select>
    </header>

    <!-- Затемнення -->
    <div class="overlay" id="overlay"></div>

    <!-- Виїзне бокове меню -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>Menu</span>
            <button class="close-btn" id="closeMenu">&times;</button>
        </div>
        
        <!-- Кнопка Додати користувача -->
        <button class="add-user-btn" id="addUserBtn">
            <span>+</span> Додати користувача
        </button>
        
        <!-- Тут будуть списки чатів/контактів -->
    </nav>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const closeMenu = document.getElementById('closeMenu');
        const overlay = document.getElementById('overlay');
        const addUserBtn = document.getElementById('addUserBtn');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        menuToggle.addEventListener('click', toggleSidebar);
        closeMenu.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        addUserBtn.addEventListener('click', () => {
            alert('Відкриття модального вікна для додавання нового користувача для спілкування!');
            // Тут можна додати логіку відкриття форми введення нікнейму чи ID
        });
    </script>
</body>
</html>
