<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habla Mobile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { 
            background-color: #121212; 
            color: #ffffff; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Верхня панель (Header) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #1e1e1e;
            border-bottom: 1px solid #333;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
        }

        .app-title {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .language-select {
            background-color: #2c2c2c;
            color: #ffffff;
            border: 1px solid #444;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .language-select option:disabled {
            color: #666;
            background-color: #1a1a1a;
        }

        /* Основна зона чату / перекладу */
        .chat-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .placeholder-message {
            text-align: center;
            color: #777;
            margin-top: 40px;
            font-size: 14px;
        }

        /* Нижня панель введення (Мікрофон, стрічка, кнопка Надіслати) */
        .footer-input-panel {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background-color: #1e1e1e;
            border-top: 1px solid #333;
        }

        /* Кнопка мікрофона */
        .mic-btn {
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #ffffff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            flex-shrink: 0;
        }

        .mic-btn:hover {
            background-color: #383838;
        }

        .mic-btn.recording {
            background-color: #ff3b30;
            border-color: #ff3b30;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* Стрічка, де писати (поле введення) */
        .text-input {
            flex: 1;
            background-color: #2c2c2c;
            color: #ffffff;
            border: 1px solid #444;
            padding: 10px 14px;
            border-radius: 22px;
            font-size: 15px;
            outline: none;
        }

        .text-input::placeholder {
            color: #888;
        }

        .text-input:focus {
            border-color: #007aff;
        }

        /* Текстова кнопка Надіслати замість стрілочки */
        .send-text-btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .send-text-btn:hover {
            background-color: #005ec4;
        }

        /* Бокове меню (Sidebar) */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: #181818;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            transition: left 0.3s ease;
            z-index: 1000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
        }

        .add-user-btn {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .add-user-btn:hover {
            background-color: #005ec4;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <!-- Шапка додатку -->
    <header class="header">
        <div class="header-left">
            <button class="menu-btn" id="menuToggle">&#9776;</button>
            <span class="app-title">Habla Mobile</span>
        </div>

        <select class="language-select" id="langSelect">
            <option value="en-US">🇺🇸 Сполучені Штати (English)</option>
            <option value="en-GB">🇬🇧 Велика Британія (English)</option>
            <option value="de-DE">🇩🇪 Німеччина (Deutsch)</option>
            <option value="pl-PL">🇵🇱 Польща (Polski)</option>
            <option value="et-EE">🇪🇪 Естонія (Eesti)</option>
            <option value="lv-LV">🇱🇻 Латвія (Latviešu)</option>
            <option value="lt-LT">🇱🇹 Литва (Lietuvių)</option>
            <option value="cs-CZ">🇨🇿 Чехія (Čeština)</option>
            <option value="nl-NL">🇳🇱 Нідерланди (Nederlands)</option>
            <option value="da-DK">🇩🇰 Данія (Dansk)</option>
            <option value="en-CA">🇨🇦 Канада (English/Français)</option>
            <option value="nb-NO">🇳🇴 Норвегія (Norsk)</option>
            <option value="fr-FR">🇫🇷 Франція (Français)</option>
            <option value="sv-SE">🇸🇪 Швеція (Svenska)</option>
            <option value="fi-FI">🇫🇮 Фінляндія (Suomi)</option>
            <option value="ru-RU" disabled>🇷🇺 Росія (Русский) — Неактивно</option>
        </select>
    </header>

    <!-- Область повідомлень / чату -->
    <div class="chat-container" id="chatContainer">
        <div class="placeholder-message">Почніть розмову або введіть текст нижче...</div>
    </div>

    <!-- Нижня панель: Мікрофон + Стрічка введення + Кнопка Надіслати -->
    <div class="footer-input-panel">
        <button class="mic-btn" id="micBtn" title="Говорити">🎙️</button>
        <input type="text" class="text-input" id="textInput" placeholder="Введіть текст...">
        <button class="send-text-btn" id="sendBtn">Надіслати</button>
    </div>

    <!-- Затемнення для меню -->
    <div class="overlay" id="overlay"></div>

    <!-- Виїзне бокове меню -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>Menu</span>
            <button class="close-btn" id="closeMenu">&times;</button>
        </div>
        
        <button class="add-user-btn" id="addUserBtn">
            <span>+</span> Додати користувача
        </button>
    </nav>

    <script>
        // Управління боковим меню
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const closeMenu = document.getElementById('closeMenu');
        const overlay = document.getElementById('overlay');
        const addUserBtn = document.getElementById('addUserBtn');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        menuToggle.addEventListener('click', toggleSidebar);
        closeMenu.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        addUserBtn.addEventListener('click', () => {
            alert('Відкриття модального вікна для додавання нового користувача!');
        });

        // --- РОЗПІЗНАВАННЯ МОВИ (ГОЛОСУ) ---
        const micBtn = document.getElementById('micBtn');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatContainer = document.getElementById('chatContainer');
        const langSelect = document.getElementById('langSelect');

        let recognition = null;
        let isRecording = false;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.title = "Слухаю...";
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                textInput.value = transcript;
            };

                recognition.onerror = (event) => {
                console.error('Помилка розпізнавання:', event.error);
                stopRecognition();
            };

            recognition.onend = () => {
                stopRecognition();
            };
        } else {
            console.warn('Web Speech API не підтримується цим браузером.');
        }

        function stopRecognition() {
            isRecording = false;
            micBtn.classList.remove('recording');
            micBtn.title = "Говорити";
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) {
                alert('Ваш браузер не підтримує голосове введення.');
                return;
            }

            if (isRecording) {
                stopRecognition();
            } else {
                recognition.lang = langSelect.value.startsWith('en') ? 'en-US' : 'uk-UA'; 
                try {
                    recognition.start();
                } catch (e) {
                    console.log(e);
                }
            }
        });

        // --- ОБРОБКА НАДІСЛАННЯ ТЕКСТУ ---
        function handleSend() {
            const text = textInput.value.trim();
            if (text) {
                const placeholder = chatContainer.querySelector('.placeholder-message');
                if (placeholder) placeholder.remove();

                const msgDiv = document.createElement('div');
                msgDiv.style.cssText = "background: #222; padding: 10px 14px; border-radius: 8px; align-self: flex-end; max-width: 80%; word-break: break-word; border: 1px solid #333;";
                msgDiv.textContent = text;
                chatContainer.appendChild(msgDiv);

                textInput.value = '';
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        sendBtn.addEventListener('click', handleSend);
        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
