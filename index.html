<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habla Mobile 3.0</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0e1621">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0e1621;
            color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            -webkit-touch-callout: none;
        }

        #pull-refresh-indicator {
            position: fixed;
            top: -50px;
            left: 0;
            width: 100%;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0e1621;
            color: #89a1b2;
            font-size: 0.85rem;
            z-index: 100;
            transition: transform 0.2s ease;
            border-bottom: 1px solid #242f3d;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2b5278;
            transition: 0.3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #89a1b2; }
        input:checked + .slider:before { transform: translateX(20px); background-color: #0e1621; }

        .lang-select {
            background: #242f3d;
            color: #f5f5f5;
            border: 1px solid #2b5278;
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
        }
        .lang-select option:disabled {
            color: #666;
            background: #17212b;
        }

        .menu-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 99;
            display: none;
        }
        .menu-overlay.active { display: block; }

        #contact-modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            background: #17212b;
            border: 1px solid #2b5278;
            border-radius: 14px;
            padding: 20px;
            z-index: 101;
            display: none;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        #contact-modal.active { display: flex; }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #242f3d;
            padding-bottom: 10px;
        }
        .modal-title { color: #f5f5f5; font-weight: bold; font-size: 1.05rem; }
        .modal-close-btn { background: none; border: none; color: #89a1b2; font-size: 1.2rem; cursor: pointer; }

        .color-palette { display: flex; gap: 10px; justify-content: space-between; margin: 4px 0; }
        .color-circle {
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: transform 0.2s, border-color 0.2s;
        }
        .color-circle:hover { transform: scale(1.15); }
        .color-circle.selected { border-color: #ffffff; }

        .modal-avatar-input {
            width: 100%; background: #242f3d; border: 1px solid #2b5278;
            color: #fff; padding: 8px 10px; border-radius: 6px; font-size: 0.85rem; outline: none;
        }
        .modal-btn-save {
            background: #2b5278; color: #fff; border: none; padding: 10px;
            border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; font-size: 0.9rem;
        }
        .modal-btn-delete {
            background: rgba(255, 59, 48, 0.2); border: 1px solid #ff3b30; color: #ff3b30;
            padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; font-size: 0.9rem;
        }

        #app-container {
            flex: 1; display: flex; flex-direction: column; position: relative;
            overflow: hidden; background: #0e1621; width: 100%;
        }

        .main-screen {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; position: relative; padding: 20px; width: 100%;
            max-width: 480px; margin: 0 auto; gap: 20px;
        }

        .notification-overlay-box {
            display: none; width: 100%; max-width: 320px;
            background: rgba(23, 33, 43, 0.85); border: 1px solid #2b5278;
            border-radius: 14px; padding: 16px; position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5); margin-bottom: 10px;
        }
        .notification-overlay-box.active { display: flex; flex-direction: column; gap: 8px; }
        .notification-text { color: #f5f5f5; font-size: 0.9rem; line-height: 1.4; padding-right: 28px; }
        .notification-tts-btn {
            position: absolute; bottom: 12px; right: 12px; background: none; border: none;
            color: #89a1b2; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center;
        }
        .notification-tts-btn:hover { color: #f5f5f5; }
        .notification-tts-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .neon-mic-btn {
            background: transparent; border: 1px solid #89a1b2; border-radius: 50%;
            width: 210px; height: 210px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
            transition: transform 0.2s, border-color 0.2s; position: relative; outline: none; gap: 6px;
        }
        .neon-mic-btn:active { transform: scale(0.96); border-color: #f5f5f5; }

        .selected-recipient-inside {
            color: #f5f5f5; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.5px; display: none;
        }
        .selected-recipient-inside.active { display: block; }
        .mic-icon-placeholder svg { stroke: #89a1b2; fill: none; width: 54px; height: 54px; }

        #contacts-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0e1621; z-index: 60; display: none; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px; gap: 16px; overflow-y: auto;
        }
        #contacts-screen.active { display: flex !important; }

        #qr-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0e1621; z-index: 60; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 20px;
        }
        #qr-screen.active { display: flex !important; }

        /* Оновлено: тепер розгортається на весь екран без обмежень ширини */
        #settings-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0e1621; z-index: 60; display: none; flex-direction: column;
            padding: 30px 20px; gap: 12px; overflow-y: auto; width: 100%;
        }
        #settings-screen.active { display: flex !important; }

        .contacts-wrapper-box { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 16px; margin: auto; }

        .profile-card-box {
            background: rgba(23, 33, 43, 0.7); border: 1px solid #89a1b2; border-radius: 16px;
            padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;
        }
        .user-avatar-large {
            width: 50px; height: 50px; border-radius: 50%;
            background: linear-gradient(135deg, #89a1b2 0%, #2b5278 100%);
            color: #0e1621; font-weight: bold; font-size: 1.2rem; display: flex;
            align-items: center; justify-content: center; overflow: hidden; border: 2px solid #89a1b2;
        }
        .user-avatar-large img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .user-badge { color: #f5f5f5; font-weight: 600; font-size: 1rem; }
        .profile-subtitle { font-size: 0.75rem; color: #89a1b2; }

        .saved-contacts-card {
            background: rgba(23, 33, 43, 0.7); border: 1px solid #89a1b2; border-radius: 16px;
            padding: 14px; display: flex; flex-direction: column; gap: 12px;
        }
        .saved-contacts-title { font-size: 0.85rem; color: #89a1b2; font-weight: 500; }
        .contacts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-height: 220px; overflow-y: auto; }

        .contact-grid-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .contact-grid-avatar {
            width: 44px; height: 44px; border-radius: 50%; background: #242f3d;
            border: 1px solid #89a1b2; color: #f5f5f5; font-weight: bold; font-size: 0.95rem;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .contact-grid-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .contact-grid-name { font-size: 0.7rem; color: #89a1b2; text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .contact-grid-item.active .contact-grid-avatar { border-color: #f5f5f5; box-shadow: 0 0 8px rgba(137, 161, 178, 0.5); }
        .contact-grid-item.active .contact-grid-name { color: #f5f5f5; font-weight: bold; }

        .add-contact-grid-circle {
            width: 44px; height: 44px; border-radius: 50%; background: rgba(43, 82, 120, 0.4);
            border: 2px dashed #89a1b2; color: #89a1b2; font-size: 1.4rem;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s, border-color 0.2s;
        }
        .add-contact-grid-circle:hover { transform: scale(1.1); border-color: #f5f5f5; color: #f5f5f5; }

        .contacts-bottom-actions {
            display: flex; justify-content: space-around; align-items: center;
            background: rgba(23, 33, 43, 0.7); border: 1px solid #89a1b2; border-radius: 14px; padding: 10px;
        }
        .action-icon-btn { background: none; border: none; color: #89a1b2; font-size: 1.2rem; cursor: pointer; padding: 6px; border-radius: 8px; }
        .action-icon-btn:hover { color: #f5f5f5; background: #242f3d; }

        #add-contact-fullscreen-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(14, 22, 33, 0.95);
            z-index: 120;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            gap: 20px;
        }
        #add-contact-fullscreen-modal.active { display: flex; }
        .add-modal-card {
            width: 100%; max-width: 340px;
            background: rgba(23, 33, 43, 0.85);
            border: 1px solid #2b5278;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .add-modal-icon-circle {
            width: 64px; height: 64px; border-radius: 50%;
            background: #2b5278; border: 2px solid #89a1b2;
            color: #f5f5f5; font-size: 2rem; display: flex;
            align-items: center; justify-content: center;
        }
        .add-modal-input {
            width: 100%; background: #242f3d; border: 1px solid #2b5278;
            color: #fff; padding: 12px 14px; border-radius: 10px; font-size: 0.95rem; outline: none; text-align: center;
        }
        .add-modal-actions { display: flex; gap: 10px; width: 100%; }
        .modal-action-btn {
            flex: 1; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.9rem; border: none; text-align: center;
        }
        .modal-btn-confirm { background: #2b5278; color: #fff; }
        .modal-btn-cancel { background: rgba(255, 59, 48, 0.2); border: 1px solid #ff3b30; color: #ff3b30; }

        .qr-cards-wrapper { display: flex; gap: 16px; width: 100%; max-width: 400px; justify-content: center; }
        .qr-card {
            flex: 1; background: rgba(23, 33, 43, 0.7); border: 1px solid #89a1b2; border-radius: 16px;
            padding: 16px 12px; display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .qr-card-title { color: #f5f5f5; font-size: 1rem; font-weight: 600; }
        .qr-img-box { background: #ffffff; padding: 6px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .qr-img-box img { width: 100px; height: 100px; display: block; }
        .copy-link-action-btn {
            background: transparent; border: 1px solid #89a1b2; color: #89a1b2; padding: 8px 12px;
            border-radius: 10px; font-size: 0.8rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; width: 100%; justify-content: center;
        }
        .ios-download-btn {
            background: transparent; border: 1px solid #89a1b2; color: #89a1b2; padding: 12px 24px;
            border-radius: 30px; font-size: 0.95rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; max-width: 320px; width: 90%; justify-content: center; margin-top: 4px;
        }

        .settings-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #242f3d; padding-bottom: 12px; font-weight: bold; color: #89a1b2; font-size: 1.1rem;
        }
        .settings-card {
            background: rgba(23, 33, 43, 0.7); border: 1px solid #89a1b2; border-radius: 14px;
            padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 480px; width: 100%; margin: 0 auto;
        }
        .settings-row {
            display: flex; justify-content: space-between; align-items: center; cursor: pointer; padding: 4px 0; color: #f5f5f5; font-size: 0.95rem;
        }
        .settings-row:hover { color: #89a1b2; }
        .dropdown-arrow { font-size: 0.8rem; color: #89a1b2; transition: transform 0.2s; }
        .dropdown-arrow.open { transform: rotate(180deg); }

        .sub-options-box { display: none; flex-direction: column; gap: 8px; padding-top: 6px; border-top: 1px solid #242f3d; }
        .sub-options-box.active { display: flex; }

        .sidebar-nav-btn {
            background: #242f3d; border: 1px solid #2b5278; color: #f5f5f5; padding: 12px 16px;
            border-radius: 10px; font-size: 0.95rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 12px; width: 100%; justify-content: center;
        }

        .bottom-nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            background: #17212b;
            border-top: 1px solid #2b5278;
            padding: 10px 16px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 70;
            width: 100%;
            flex-shrink: 0;
            padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
        }
        .nav-item {
            background: none; border: none; color: #89a1b2; display: flex; flex-direction: column;
            align-items: center; gap: 4px; cursor: pointer; padding: 6px 16px; border-radius: 8px;
        }
        .nav-item svg { width: 24px; height: 24px; stroke: #89a1b2; fill: none; }
        .nav-item small { font-size: 0.75rem; font-weight: 500; color: #89a1b2; }
        .nav-item:hover svg, .nav-item.active svg { color: #f5f5f5; stroke: #f5f5f5; }
    </style>
</head>
<body>

    <div id="pull-refresh-indicator">🔄 Потягніть, щоб оновити...</div>
    <div id="menu-overlay" class="menu-overlay"></div>

    <div id="contact-modal">
        <div class="modal-header">
            <span id="modal-contact-title" class="modal-title">Контакт</span>
            <button id="close-contact-modal" class="modal-close-btn">✕</button>
        </div>
        <div style="font-size: 0.8rem; color: #89a1b2;" data-i18n="icon_bg_color">Колір фону іконки:</div>
        <div class="color-palette" id="color-palette">
            <div class="color-circle" style="background: #89a1b2;" data-color="#89a1b2"></div>
            <div class="color-circle" style="background: #2b5278;" data-color="#2b5278"></div>
            <div class="color-circle" style="background: #4a6fa5;" data-color="#4a6fa5"></div>
            <div class="color-circle" style="background: #ff3b30;" data-color="#ff3b30"></div>
            <div class="color-circle" style="background: #7928ca;" data-color="#7928ca"></div>
            <div class="color-circle" style="background: #0056b3;" data-color="#0056b3"></div>
        </div>
        <div style="font-size: 0.8rem; color: #89a1b2;" data-i18n="avatar_url">Посилання на фото-аватарку (URL):</div>
        <input type="text" id="modal-avatar-input" class="modal-avatar-input" placeholder="https://...">
        <button id="modal-save-btn" class="modal-btn-save" data-i18n="save">💾 Зберегти</button>
        <button id="modal-delete-btn" class="modal-btn-delete" data-i18n="delete_contact">🗑 Видалити контакт</button>
    </div>

    <div id="add-contact-fullscreen-modal">
        <div class="add-modal-card">
            <div class="add-modal-icon-circle">➕</div>
            <div style="font-weight: bold; font-size: 1.1rem; color: #f5f5f5;">Додати новий контакт</div>
            <input type="text" id="fullscreen-contact-input" class="add-modal-input" placeholder="Введіть нікнейм...">
            <div class="add-modal-actions">
                <button id="fullscreen-cancel-btn" class="modal-action-btn modal-btn-cancel">Скасувати</button>
                <button id="fullscreen-confirm-btn" class="modal-action-btn modal-btn-confirm">Додати</button>
            </div>
        </div>
    </div>

    <div id="app-container">
        <main class="main-screen">
            <div id="notification-box" class="notification-overlay-box">
                <div id="notification-text" class="notification-text"></div>
                <button id="notification-tts-btn" class="notification-tts-btn" title="Прослухати">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
            </div>

            <button id="mic-button" class="neon-mic-btn" title="Натисніть для запису голосу">
                <div id="selected-recipient-display" class="selected-recipient-inside"></div>
                <div class="mic-icon-placeholder">
                    <svg viewBox="0 0 24 24" stroke="#89a1b2" stroke-width="2" fill="none"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                </div>
            </button>
        </main>

        <div id="contacts-screen">
            <div class="contacts-wrapper-box">
                <div id="profile-settings-trigger" class="profile-card-box" title="Налаштування профілю">
                    <div id="user-avatar-large" class="user-avatar-large">G</div>
                    <div style="text-align: center;">
                        <div id="user-display" class="user-badge">Стасан</div>
                        <div class="profile-subtitle" data-i18n="profile_settings">Profile Settings</div>
                    </div>
                </div>

                <div class="saved-contacts-card">
                    <div class="saved-contacts-title" id="label-saved-contacts" data-i18n="saved_contacts">Збережені контакти</div>
                    <div class="contacts-grid" id="contacts-grid-container"></div>
                </div>

                <div class="contacts-bottom-actions">
                    <button class="action-icon-btn" id="sidebar-add-btn" title="Додати контакт">➕</button>
                    <button class="action-icon-btn" id="sidebar-settings-btn" title="Налаштування">⚙️</button>
                    <button class="action-icon-btn" id="sidebar-call-btn" title="Зв'язок">📞</button>
                </div>
            </div>
        </div>

        <div id="qr-screen">
            <div class="qr-cards-wrapper">
                <div class="qr-card">
                    <div class="qr-card-title">Android App</div>
                    <div class="qr-img-box"><img id="qr-android-img" src="" alt="Android QR"></div>
                    <button class="copy-link-action-btn" id="copy-android-btn">📋 Copy Link</button>
                </div>
                <div class="qr-card">
                    <div class="qr-card-title">PC App</div>
                    <div class="qr-img-box"><img id="qr-pc-img" src="" alt="PC QR"></div>
                    <button class="copy-link-action-btn" id="copy-pc-btn">📋 Copy Link</button>
                </div>
            </div>
            <button class="ios-download-btn" id="ios-download-btn">🍎 Download on iOS</button>
        </div>

        <div id="settings-screen">
            <div class="settings-header" style="max-width:480px; width:100%; margin:0 auto;">
                <span data-i18n="settings_title">Налаштування</span>
                <button id="close-settings-screen" style="background:none; border:none; color:#89a1b2; font-size:1.2rem; cursor:pointer;">✕</button>
            </div>

            <div class="settings-card">
                <button id="update-app-btn" class="sidebar-nav-btn">🔄 <span data-i18n="update_app">Оновлення програми</span></button>
            </div>

            <div class="settings-card">
                <div class="settings-row" id="toggle-lang-dropdown">
                    <span data-i18n="interface_lang">Мова інтерфейсу</span>
                    <span class="dropdown-arrow" id="lang-arrow">▼</span>
                </div>
                <div class="sub-options-box" id="lang-options-box">
                    <select id="interface-lang" class="lang-select">
                        <option value="Spanish">Spanish</option>
                        <option value="English">English</option>
                        <option value="Ukrainian">Ukrainian</option>
                        <option value="German">German</option>
                        <option value="French">French</option>
                        <option value="Russian" disabled>Russian</option>
                    </select>
                </div>
            </div>

            <div class="settings-card">
                <div class="settings-row" id="toggle-voice-dropdown">

        function applyLocalization(lang) {
            const dict = translations[lang] || translations['Spanish'];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) {
                    el.textContent = dict[key];
                }
            });
        }

        let selectedRecipientName = null;
        let recentContactsOrder = JSON.parse(localStorage.getItem('habla_recent_contacts') || '["Максим", "Стасан", "notebook", "Марина"]');
        let localAddedContacts = JSON.parse(localStorage.getItem('habla_local_contacts') || '[]');
        let contactColors = JSON.parse(localStorage.getItem('habla_contact_colors') || '{}');
        let contactAvatars = JSON.parse(localStorage.getItem('habla_contact_avatars') || '{}');
        let activeContactForModal = null;
        let selectedModalColor = '#89a1b2';
        let lastUsersData = [];

        socket.on('sync-customizations', (customizations) => {
            contactColors = {};
            contactAvatars = {};
            for (let [name, data] of Object.entries(customizations)) {
                if (data.color) contactColors[name] = data.color;
                if (data.avatar) contactAvatars[name] = data.avatar;
            }
            localStorage.setItem('habla_contact_colors', JSON.stringify(contactColors));
            localStorage.setItem('habla_contact_avatars', JSON.stringify(contactAvatars));
            updateProfileDisplay();
            safeRenderContactsGrid(lastUsersData);
        });

        function getDeviceLanguage() {
            const navLang = (navigator.language || navigator.userLanguage || 'es').toLowerCase();
            if (navLang.startsWith('uk')) return 'Ukrainian';
            if (navLang.startsWith('en')) return 'English';
            if (navLang.startsWith('de')) return 'German';
            if (navLang.startsWith('fr')) return 'French';
            return 'Spanish';
        }

        let username = localStorage.getItem('habla_username');
        if (!username) {
            username = prompt("Introduce tu apodo / Introduce your nickname:") || "Стасан";
            username = username.trim();
            localStorage.setItem('habla_username', username);
        }

        const interfaceLangSelect = document.getElementById('interface-lang');
        let savedInterfaceLang = localStorage.getItem('habla_interface_lang') || getDeviceLanguage();
        if (savedInterfaceLang === 'Russian') savedInterfaceLang = 'Spanish';
        interfaceLangSelect.value = savedInterfaceLang;
        applyLocalization(savedInterfaceLang);

        interfaceLangSelect.addEventListener('change', () => {
            const newLang = interfaceLangSelect.value;
            if (newLang === 'Russian') return;
            localStorage.setItem('habla_interface_lang', newLang);
            applyLocalization(newLang);
            socket.emit('update-language', newLang);
            joinWithLanguage();
        });

        function joinWithLanguage() {
            if (username) {
                socket.emit('join', {
                    username: username,
                    lang: interfaceLangSelect.value
                });
            }
        }

        socket.on('connect', () => {
            joinWithLanguage();
        });

        const userDisplay = document.getElementById('user-display');
        const userAvatarLarge = document.getElementById('user-avatar-large');
        const selectedRecipientDisplay = document.getElementById('selected-recipient-display');

        function updateProfileDisplay() {
            userDisplay.textContent = username;
            const customColor = contactColors[username] || '#89a1b2';
            const customAvatarUrl = contactAvatars[username];
            
            if (customAvatarUrl) {
                userAvatarLarge.innerHTML = `<img src="${escapeHtml(customAvatarUrl)}" alt="">`;
                userAvatarLarge.style.background = 'none';
            } else {
                userAvatarLarge.innerHTML = username.charAt(0).toUpperCase();
                userAvatarLarge.style.background = customColor;
                userAvatarLarge.style.color = '#0e1621';
            }
        }

        const contactsGridContainer = document.getElementById('contacts-grid-container');

        function safeRenderContactsGrid(onlineUsers = []) {
            try {
                if (!contactsGridContainer) return;
                contactsGridContainer.innerHTML = '';
                
                let onlineArr = Array.isArray(onlineUsers) ? onlineUsers : [];
                let allContactsSet = new Set([...recentContactsOrder, ...localAddedContacts, ...onlineArr]);
                if (username) allContactsSet.delete(username);
                let contactsList = Array.from(allContactsSet);

                contactsList.forEach(name => {
                    if (!name) return;
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'contact-grid-item';
                    if (selectedRecipientName === name) {
                        itemDiv.classList.add('active');
                    }

                    const avatarDiv = document.createElement('div');
                    avatarDiv.className = 'contact-grid-avatar';
                    const customColor = contactColors[name] || '#2b5278';
                    const customAvatarUrl = contactAvatars[name];

                    if (customAvatarUrl) {
                        avatarDiv.innerHTML = `<img src="${escapeHtml(customAvatarUrl)}" alt="">`;
                    } else {
                        avatarDiv.textContent = name.charAt(0).toUpperCase();
                        avatarDiv.style.background = customColor;
                    }

                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'contact-grid-name';
                    nameDiv.textContent = name;

                    itemDiv.appendChild(avatarDiv);
                    itemDiv.appendChild(nameDiv);

                    itemDiv.addEventListener('click', () => {
                        selectedRecipientName = name;
                        selectedRecipientDisplay.textContent = name;
                        selectedRecipientDisplay.classList.add('active');
                        closeAllScreens();
                        setActiveNav(navHome);
                        safeRenderContactsGrid(lastUsersData);
                    });

                    itemDiv.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        triggerSettings(name, e);
                    });

                    contactsGridContainer.appendChild(itemDiv);
                });

                const addGridItem = document.createElement('div');
                addGridItem.className = 'contact-grid-item';
                
                const addCircle = document.createElement('div');
                addCircle.className = 'add-contact-grid-circle';
                addCircle.textContent = '+';
                addCircle.title = 'Додати новий контакт';

                const addName = document.createElement('div');
                addName.className = 'contact-grid-name';
                addName.textContent = 'Add';

                addGridItem.appendChild(addCircle);
                addGridItem.appendChild(addName);

                addGridItem.addEventListener('click', () => {
                    openFullscreenAddContactModal();
                });

                contactsGridContainer.appendChild(addGridItem);
            } catch (err) {
                console.error("Помилка відображення контактів:", err);
            }
        }

        const fullscreenModal = document.getElementById('add-contact-fullscreen-modal');
        const fullscreenInput = document.getElementById('fullscreen-contact-input');
        const fullscreenConfirmBtn = document.getElementById('fullscreen-confirm-btn');
        const fullscreenCancelBtn = document.getElementById('fullscreen-cancel-btn');

        function openFullscreenAddContactModal() {
            if (fullscreenInput) fullscreenInput.value = '';
            if (fullscreenModal) fullscreenModal.classList.add('active');
            if (fullscreenInput) fullscreenInput.focus();
        }

        function closeFullscreenAddContactModal() {
            if (fullscreenModal) fullscreenModal.classList.remove('active');
        }

        if (fullscreenCancelBtn) fullscreenCancelBtn.addEventListener('click', closeFullscreenAddContactModal);
        
        if (fullscreenConfirmBtn) fullscreenConfirmBtn.addEventListener('click', () => {
            const targetName = fullscreenInput.value.trim();
            if (targetName && targetName !== username) {
                socket.emit('add-contact', targetName);
                if (!localAddedContacts.includes(targetName)) {
                    localAddedContacts.push(targetName);
                    localStorage.setItem('habla_local_contacts', JSON.stringify(localAddedContacts));
                }
                closeFullscreenAddContactModal();
                safeRenderContactsGrid(lastUsersData);
            } else {
                alert('Введіть коректне ім\'я контакту!');
            }
        });

        if (fullscreenInput) fullscreenInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fullscreenConfirmBtn.click();
        });

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        const micButton = document.getElementById('mic-button');

        micButton.addEventListener('click', async () => {
            if (!selectedRecipientName) {
                alert('Будь ласка, оберіть співрозмовника у меню Контакти!');
                return;
            }

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            const base64Audio = reader.result;
                            socket.emit('voice-message', {
                                sender: username,
                                recipient: selectedRecipientName,
                                audio: base64Audio
                            });
                        };
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micButton.style.borderColor = '#ff3b30';
                } catch (err) {
                    console.error("Помилка мікрофона:", err);
                    alert("Не вдалося отримати доступ до мікрофона.");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micButton.style.borderColor = '#89a1b2';
            }
        });

        const notificationBox = document.getElementById('notification-box');
        const notificationText = document.getElementById('notification-text');
        const notificationTtsBtn = document.getElementById('notification-tts-btn');
        let lastReceivedText = '';

        socket.on('incoming-message', (data) => {
            lastReceivedText = data.text;
            notificationText.textContent = data.text;
            notificationBox.classList.add('active');

            if (data.sender) {
                selectedRecipientName = data.sender;
                selectedRecipientDisplay.textContent = data.sender;
                selectedRecipientDisplay.classList.add('active');
            }

            // Озвучуємо лише якщо чекбокс "sound-toggle" включений
            const soundToggle = document.getElementById('sound-toggle');
            if (data.text && soundToggle && soundToggle.checked) {
                speakText(data.text);
            }
        });

        notificationTtsBtn.addEventListener('click', () => {
            if (lastReceivedText) {
                speakText(lastReceivedText);
            }
        });

        let touchStartY = 0;
        const refreshIndicator = document.getElementById('pull-refresh-indicator');

        window.addEventListener('touchstart', (e) => {
            if (window.scrollY === 0) {
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (touchStartY > 0) {
                const currentY = e.touches[0].clientY;
                const diff = currentY - touchStartY;
                if (diff > 0 && diff < 120) {
                    refreshIndicator.style.transform = `translateY(${diff}px)`;
                }
            }
        }, { passive: true });

        window.addEventListener('touchend', async (e) => {
            if (touchStartY > 0) {
                const endY = e.changedTouches[0].clientY;
                if (endY - touchStartY > 80) {
                    refreshIndicator.textContent = '⏳ Оновлення програми...';
                    refreshIndicator.style.transform = `translateY(50px)`;
                    try {
                        if ('serviceWorker' in navigator) {
                            const reg = await navigator.serviceWorker.getRegistration();
                            if (reg) await reg.update();
                        }
                        if ('caches' in window) {
                            const keys = await caches.keys();
                            await Promise.all(keys.map(k => caches.delete(k)));
                        }
                    } catch (err) {}
                    setTimeout(() => window.location.reload(true), 400);
                } else {
                    refreshIndicator.style.transform = `translateY(0px)`;
                }
                touchStartY = 0;
            }
        });

        let availableVoices = [];
        function populateVoiceList() {
            if (typeof speechSynthesis === 'undefined') return;
            availableVoices = speechSynthesis.getVoices();
        }
        populateVoiceList();
        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        const ttsLangMap = { 'Ukrainian': 'uk-UA', 'English': 'en-US', 'Spanish': 'es-ES', 'German': 'de-DE', 'French': 'fr-FR' };

        function speakText(textToSpeech) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(textToSpeech);
            const activeLang = interfaceLangSelect.value;
            utterance.lang = ttsLangMap[activeLang] || 'es-ES';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        document.getElementById('reset-user-btn').addEventListener('click', () => {
            localStorage.removeItem('habla_username');
            location.reload();
        });

        const updateAppBtn = document.getElementById('update-app-btn');
        if (updateAppBtn) {
            updateAppBtn.addEventListener('click', async () => {
                updateAppBtn.textContent = '⏳ Перевірка оновлень...';
                try {
                    if ('serviceWorker' in navigator) {
                        const registration = await navigator.serviceWorker.getRegistration();
                        if (registration) {
                            await registration.update();
                            if (registration.waiting) {
                                registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                            }
                        }
                    }
                    if ('caches' in window) {
                        const cacheNames = await caches.keys();
                        await Promise.all(cacheNames.map(name => caches.delete(name)));
                    }
                    setTimeout(() => {
                        window.location.reload(true);
                    }, 500);
                } catch (err) {
                    window.location.reload(true);
                }
            });
        }

        const currentAppUrl = window.location.origin;
        document.getElementById('qr-android-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentAppUrl)}`;
        document.getElementById('qr-pc-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentAppUrl)}`;

        document.getElementById('copy-android-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(currentAppUrl).then(() => alert('Посилання Android скопійовано!'));
        });
        document.getElementById('copy-pc-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(currentAppUrl).then(() => alert('Посилання PC скопійовано!'));
        });
        document.getElementById('ios-download-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(currentAppUrl).then(() => alert('Посилання iOS скопійовано!'));
        });

        const toggleLangDropdown = document.getElementById('toggle-lang-dropdown');
        const langOptionsBox = document.getElementById('lang-options-box');
        const langArrow = document.getElementById('lang-arrow');

        toggleLangDropdown.addEventListener('click', () => {
            langOptionsBox.classList.toggle('active');
            langArrow.classList.toggle('open');
        });

        const toggleVoiceDropdown = document.getElementById('toggle-voice-dropdown');
        const voiceOptionsBox = document.getElementById('voice-options-box');
        const voiceArrow = document.getElementById('voice-arrow');

        toggleVoiceDropdown.addEventListener('click', () => {
            voiceOptionsBox.classList.toggle('active');
            voiceArrow.classList.toggle('open');
        });

        document.getElementById('btn-appearance').addEventListener('click', () => {
            alert('Зовнішній вигляд: Темна неон тема активована.');
        });
        document.getElementById('btn-data-storage').addEventListener('click', () => {
            alert('Дані та пам\'ять: Кеш успішно оптимізовано.');
        });
        document.getElementById('btn-help').addEventListener('click', () => {
            alert('Допомога: Habla Mobile 3.0 — голосовий перекладач та месенджер.');
        });

        const navHome = document.getElementById('nav-home');
        const navContacts = document.getElementById('nav-contacts');
        const navQr = document.getElementById('nav-qr');
        const navSettings = document.getElementById('nav-settings');
        const navItems = document.querySelectorAll('.nav-item');
        const qrScreen = document.getElementById('qr-screen');
        const contactsScreen = document.getElementById('contacts-screen');
        const settingsScreen = document.getElementById('settings-screen');
        const menuOverlay = document.getElementById('menu-overlay');

        function setActiveNav(selectedItem) {
            navItems.forEach(item => item.classList.remove('active'));
            if (selectedItem) {
                selectedItem.classList.add('active');
            }
        }

        function closeAllScreens() {
            if (qrScreen) qrScreen.classList.remove('active');
            if (contactsScreen) contactsScreen.classList.remove('active');
            if (settingsScreen) settingsScreen.classList.remove('active');
            if (fullscreenModal) fullscreenModal.classList.remove('active');
        }

        navHome.addEventListener('click', () => {
            closeAllScreens();
            setActiveNav(navHome);
        });

        navContacts.addEventListener('click', () => {
            const isCurrentlyOpen = contactsScreen && contactsScreen.classList.contains('active');
            closeAllScreens();
            
            if (isCurrentlyOpen) {
                setActiveNav(navHome);
            } else {
                setActiveNav(navContacts);
                if (contactsScreen) contactsScreen.classList.add('active');
                setTimeout(() => {
                    safeRenderContactsGrid(lastUsersData);
                }, 10);
            }
        });

        navQr.addEventListener('click', () => {
            const isCurrentlyOpen = qrScreen && qrScreen.classList.contains('active');
            closeAllScreens();
            if (isCurrentlyOpen) {
                setActiveNav(navHome);
            } else {
                setActiveNav(navQr);
                if (qrScreen) qrScreen.classList.add('active');
            }
        });

        navSettings.addEventListener('click', () => {
            const isCurrentlyOpen = settingsScreen && settingsScreen.classList.contains('active');
            closeAllScreens();
            if (isCurrentlyOpen) {
                setActiveNav(navHome);
            } else {
                setActiveNav(navSettings);
                if (settingsScreen) settingsScreen.classList.add('active');
            }
        });

        document.getElementById('close-settings-screen').addEventListener('click', () => {
            closeAllScreens();
            setActiveNav(navHome);
        });

        document.getElementById('sidebar-settings-btn').addEventListener('click', () => {
            closeAllScreens();
            if (settingsScreen) settingsScreen.classList.add('active');
            setActiveNav(navSettings);
        });

        const contactModal = document.getElementById('contact-modal');
        const modalContactTitle = document.getElementById('modal-contact-title');
        const closeContactModal = document.getElementById('close-contact-modal');
        const modalDeleteBtn = document.getElementById('modal-delete-btn');
        const modalSaveBtn = document.getElementById('modal-save-btn');
        const modalAvatarInput = document.getElementById('modal-avatar-input');
        const colorCircles = document.querySelectorAll('.color-circle');

        closeContactModal.addEventListener('click', () => {
            contactModal.classList.remove('active');
            menuOverlay.classList.remove('active');
        });

        menuOverlay.addEventListener('click', () => {
            contactModal.classList.remove('active');
            menuOverlay.classList.remove('active');
        });

        function triggerSettings(targetName, e) {
            e.preventDefault();
            activeContactForModal = targetName;
            modalContactTitle.textContent = targetName === username ? `⚙️ Мій профіль (${targetName})` : `⚙️ ${targetName}`;
            
            if (targetName === username) {
                modalDeleteBtn.style.display = 'none';
            } else {
                modalDeleteBtn.style.display = 'block';
            }

            selectedModalColor = contactColors[targetName] || '#89a1b2';
            colorCircles.forEach(c => {
                if (c.getAttribute('data-color') === selectedModalColor) {
                    c.classList.add('selected');
                } else {
                    c.classList.remove('selected');
                }
            });

            modalAvatarInput.value = contactAvatars[targetName] || '';

            contactModal.classList.add('active');
            menuOverlay.classList.add('active');
        }

        const profileSettingsTrigger = document.getElementById('profile-settings-trigger');
        profileSettingsTrigger.addEventListener('click', (e) => triggerSettings(username, e));

        colorCircles.forEach(circle => {
            circle.addEventListener('click', () => {
                colorCircles.forEach(c => c.classList.remove('selected'));
                circle.classList.add('selected');
                selectedModalColor = circle.getAttribute('data-color');
            });
        });

        modalSaveBtn.addEventListener('click', () => {
            if (!activeContactForModal) return;
            
            const color = selectedModalColor;
            const avatar = modalAvatarInput.value.trim();

            contactColors[activeContactForModal] = color;
            if (avatar) {
                contactAvatars[activeContactForModal] = avatar;
            } else {
                delete contactAvatars[activeContactForModal];
            }

            socket.emit('update-customization', {
                targetName: activeContactForModal,
                color: color,
                avatar: avatar
            });

            contactModal.classList.remove('active');
            menuOverlay.classList.remove('active');
            updateProfileDisplay();
            safeRenderContactsGrid(lastUsersData);
        });

        modalDeleteBtn.addEventListener('click', () => {
            if (!activeContactForModal || activeContactForModal === username) return;
            if (confirm(`Видалити контакт ${activeContactForModal}?`)) {
                localAddedContacts = localAddedContacts.filter(n => n !== activeContactForModal);
                localStorage.setItem('habla_local_contacts', JSON.stringify(localAddedContacts));
                recentContactsOrder = recentContactsOrder.filter(n => n !== activeContactForModal);
                localStorage.setItem('habla_recent_contacts', JSON.stringify(recentContactsOrder));
                delete contactColors[activeContactForModal];
                delete contactAvatars[activeContactForModal];
                
                socket.emit('update-customization', {
                    targetName: activeContactForModal,
                    color: '#89a1b2',
                    avatar: ''
                });

                contactModal.classList.remove('active');
                menuOverlay.classList.remove('active');
                safeRenderContactsGrid(lastUsersData);
            }
        });

        socket.on('update-users', ({ users, isAdmin }) => {
            lastUsersData = users;
            safeRenderContactsGrid(users);
        });

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        updateProfileDisplay();
        safeRenderContactsGrid();
    </script>
</body>
</html>
