<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habla - Messenger</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; background-color: #0b0f12; color: #ffffff; overflow: hidden; }
        .app-container { width: 100vw; height: 100vh; height: 100dvh; background-color: #121619; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background-color: #121619; border-bottom: 1px solid #1a2228; flex-shrink: 0; gap: 6px; }
        .back-link { color: #00e5ff; text-decoration: none; font-size: 20px; cursor: pointer; }
        .header-info { text-align: center; flex: 1; }
        .header-info h3 { font-size: 14px; font-weight: 600; }
        .header-info p { font-size: 11px; color: #8c9ba5; }
        .lang-select { background: #182026; color: #00e5ff; border: 1px solid #00e5ff55; padding: 4px 6px; border-radius: 8px; outline: none; font-size: 12px; max-width: 110px; }
        .settings-btn { background: transparent; border: none; color: #00e5ff; font-size: 18px; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }

        /* Екран контактів */
        #contactsView { display: flex; flex-direction: column; flex: 1; overflow-y: auto; padding: 15px; }
        .contacts-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .contacts-title { font-size: 15px; font-weight: bold; color: #00e5ff; }
        .add-contact-btn { background: #00e5ff; color: #121619; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }
        
        .contact-item { display: flex; align-items: center; background: #182026; border: 1px solid #1a2228; padding: 12px 15px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; justify-content: space-between; }
        .contact-item:hover { border-color: #00e5ff; }
        .contact-left { display: flex; align-items: center; flex: 1; }
        .contact-avatar { width: 40px; height: 40px; background: #00e5ff22; border: 1px solid #00e5ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #00e5ff; margin-right: 12px; flex-shrink: 0; }
        .contact-info h4 { font-size: 15px; color: #fff; }
        .contact-info p { font-size: 12px; color: #8c9ba5; margin-top: 2px; }
        .delete-contact { background: transparent; border: none; color: #ff4d4d; font-size: 16px; cursor: pointer; padding: 5px; }

        .empty-list { text-align: center; color: #8c9ba5; font-size: 13px; margin-top: 30px; }

        /* Екран чату */
        #chatView { display: none; flex-direction: column; flex: 1; overflow: hidden; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .message.incoming { background-color: #182026; border: 1px solid #00e5ff44; align-self: flex-start; }
        .message.outgoing { background-color: #1a2228; border: 1px solid #00e5ff; align-self: flex-end; }
        
        .footer { padding: 10px 15px 25px 15px; background-color: #121619; border-top: 1px solid #1a2228; display: flex; flex-direction: column; align-items: center; gap: 10px; flex-shrink: 0; }
        .input-box { width: 100%; display: flex; background: #182026; border: 1px solid #00e5ff; border-radius: 12px; padding: 6px 10px; align-items: center; }
        .input-box input { flex: 1; background: transparent; border: none; color: white; font-size: 14px; outline: none; }
        .send-btn { background: transparent; border: none; color: #00e5ff; font-size: 22px; cursor: pointer; padding: 10px; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
        
        .mic-container { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 5px; }
        .mic-label { font-size: 11px; color: #8c9ba5; }
        .mic-btn { width: 54px; height: 54px; background: #182026; border: 2px solid #00e5ff; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }
        .mic-btn.recording { background: #00e5ff; }
        .mic-btn.recording .mic-icon { color: #121619; }
        .mic-icon { font-size: 22px; color: #00e5ff; }
    </style>
</head>

        <div style="background:#121619; padding:25px; border-radius:12px; width:90%; max-width:320px; text-align:center; border: 1px solid #00e5ff;">
            <h3 style="color:#fff; margin-bottom:15px;">Введіть ваш нікнейм</h3>
            <input type="text" id="nicknameInput" placeholder="Ваш нікнейм..." style="width:100%; padding:10px; border-radius:6px; border:1px solid #00e5ff55; background:#182026; color:#fff; font-size:16px; margin-bottom:15px; outline:none;">
            <button onclick="saveNickname()" style="width:100%; padding:10px; background:#00e5ff; color:#121619; border:none; border-radius:6px; font-weight:bold; font-size:16px; cursor:pointer;">Зберегти</button>
        </div>

    </div>
