<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habla Mobile</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --text-color: #e0e0e0;
            --border-color: #333333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--surface-color);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            margin: 0 0 5px 0;
            font-size: 1.4rem;
        }
        textarea, select, button {
            background: #2a2a2a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            min-height: 90px;
        }
        button {
            background-color: var(--primary-color);
            color: #121212;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .result {
            background: #121212;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            min-height: 70px;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }
        .download-link {
            text-align: center;
            margin-top: 6px;
        }
        .download-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.85rem;
        }
        .download-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Habla Mobile</h2>
        
        <select id="targetLang">
            <option value="en">English</option>
            <option value="uk">Українська</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
        </select>

        <textarea id="inputText" placeholder="Введіть текст для перекладу..."></textarea>
        <button id="translateBtn">Перекласти</button>

        <div class="result" id="resultText">Тут з'явиться переклад...</div>

        <div class="download-link">
            <a href="/downloads/habla.apk">📥 Завантажити актуальний Habla.apk</a>
        </div>
    </div>

    <script>
        document.getElementById('translateBtn').onclick = async () => {
            const text = document.getElementById('inputText').value.trim();
            const targetLang = document.getElementById('targetLang').value;
            const resultBox = document.getElementById('resultText');

            if (!text) return;
            resultBox.innerText = 'Перекладається...';

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, targetLang })
                });
                const data = await response.json();
                resultBox.innerText = data.translatedText || 'Помилка перекладу';
            } catch (e) {
                resultBox.innerText = 'Помилка з\'єднання з сервером';
            }
        };
    </script>
</body>
</html>
