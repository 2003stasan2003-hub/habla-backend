<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Habla - Mobile Version</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; background-color: #0b0f12; color: #ffffff; overflow: hidden; }
        .app-container { width: 100vw; height: 100vh; height: 100dvh; background-color: #121619; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background-color: #121619; border-bottom: 1px solid #1a2228; flex-shrink: 0; gap: 6px; }
        .back-link { color: #00e5ff; text-decoration: none; font-size: 20px; }
        .header-info { text-align: center; flex: 1; }
        .header-info h3 { font-size: 14px; font-weight: 600; }
        .header-info p { font-size: 11px; color: #8c9ba5; }
        .lang-select { background: #182026; color: #00e5ff; border: 1px solid #00e5ff55; padding: 4px 6px; border-radius: 8px; outline: none; font-size: 12px; max-width: 110px; }
        .settings-btn { background: transparent; border: none; color: #00e5ff; font-size: 18px; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
        
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .message.incoming { background-color: #182026; border: 1px solid #00e5ff44; align-self: flex-start; }
        .message.outgoing { background-color: #1a2228; border: 1px solid #00e5ff; align-self: flex-end; }
        
        .footer { padding: 10px 15px 25px 15px; background-color: #121619; border-top: 1px solid #1a2228; display: flex; flex-direction: column; align-items: center; gap: 10px; flex-shrink: 0; }
        .input-box { width: 100%; display: flex; background: #182026; border: 1px solid #00e5ff; border-radius: 12px; padding: 6px 10px; align-items: center; }
        .input-box input { flex: 1; background: transparent; border: none; color: white; font-size: 14px; outline: none; }
        .send-btn { background: transparent; border: none; color: #00e5ff; font-size: 22px; cursor: pointer; padding: 10px; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
        
        .mic-container { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 5px; }
        .mic-label { font-size: 11px; color: #8c9ba5; }
        .mic-btn { width: 54px; height: 54px; background: #182026; border: 2px solid #00e5ff; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }
        .mic-btn.recording { background: #00e5ff; }
        .mic-btn.recording .mic-icon { color: #121619; }
        .mic-icon { font-size: 22px; color: #00e5ff; }
    </style>
</head>
<body>
    <!-- Модальне вікно для первинного введення нікнейму -->
    <div id="nicknameModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#121619; padding:25px; border-radius:12px; width:90%; max-width:320px; text-align:center; border: 1px solid #00e5ff;">
            <h3 id="modalNickTitle" style="color:#fff; margin-bottom:15px; font-family:sans-serif;">Введіть ваш нікнейм</h3>
            <p id="modalNickDesc" style="color:#8c9ba5; font-size:13px; margin-bottom:20px; font-family:sans-serif;">Це необхідно для ідентифікації тестувальника.</p>
            <input type="text" id="nicknameInput" placeholder="Ваш нікнейм..." style="width:100%; padding:10px; border-radius:6px; border:1px solid #00e5ff55; background:#182026; color:#fff; font-size:16px; box-sizing:border-box; margin-bottom:15px; outline:none;">
            <button id="modalSaveBtn" onclick="saveNickname()" style="width:100%; padding:10px; background:#00e5ff; color:#121619; border:none; border-radius:6px; font-weight:bold; font-size:16px; cursor:pointer;">Зберегти</button>
        </div>
    </div>

    <!-- Модальне вікно Налаштування (⚙️) -->
    <div id="settingsModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#121619; padding:25px; border-radius:12px; width:90%; max-width:320px; text-align:center; border: 1px solid #00e5ff;">
            <h3 id="settingsTitle" style="color:#fff; margin-bottom:15px; font-family:sans-serif;">⚙️ Налаштування</h3>
            
            <p id="settingsNickLabel" style="color:#8c9ba5; font-size:13px; margin-bottom:6px; font-family:sans-serif; text-align:left;">Змінити ваш нікнейм:</p>
            <input type="text" id="settingsNicknameInput" placeholder="Новий нікнейм..." style="width:100%; padding:10px; border-radius:6px; border:1px solid #00e5ff55; background:#182026; color:#fff; font-size:16px; box-sizing:border-box; margin-bottom:10px; outline:none;">
            <button id="settingsUpdateBtn" onclick="updateNickname()" style="width:100%; padding:9px; background:#00e5ff; color:#121619; border:none; border-radius:6px; font-weight:bold; font-size:14px; cursor:pointer; margin-bottom:15px;">Оновити нікнейм</button>

            <p id="settingsUiLangLabel" style="color:#8c9ba5; font-size:13px; margin-bottom:6px; font-family:sans-serif; text-align:left;">Мова інтерфейсу програми:</p>
            <select id="uiLangSelect" style="width:100%; padding:10px; border-radius:6px; border:1px solid #00e5ff55; background:#182026; color:#00e5ff; font-size:15px; box-sizing:border-box; margin-bottom:20px; outline:none;" onchange="handleUiLangChange(this)">
                <option value="Ukrainian">Українська</option>
                <option value="Spanish">Spanish</option>
                <option value="English">English</option>
                <option value="German">German</option>
                <option value="French">French</option>
                <option value="Italian">Italian</option>
                <option value="Georgian">Georgian</option>
                <option value="Japanese">Japanese</option>
                <option value="Russian">Russian</option>
            </select>

            <button id="settingsCloseBtn" onclick="closeSettings()" style="width:100%; padding:8px; background:transparent; color:#8c9ba5; border:1px solid #333; border-radius:6px; font-size:14px; cursor:pointer;">Закрити</button>
        </div>
    </div>

    <!-- Модальне вікно "Агресор" -->
    <div id="aggressorModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#121619; padding:25px; border-radius:12px; width:90%; max-width:320px; text-align:center; border: 1px solid #ff4d4d;">
            <h3 id="aggressorTitle" style="color:#ff4d4d; margin-bottom:15px; font-family:sans-serif;">Увага</h3>
            <p id="aggressorText" style="color:#fff; font-size:16px; font-weight:bold; margin-bottom:20px; font-family:sans-serif;">Агресор</p>
            <button id="aggressorOkBtn" onclick="closeAggressorModal()" style="width:100%; padding:10px; background:#ff4d4d; color:#fff; border:none; border-radius:6px; font-weight:bold; font-size:16px; cursor:pointer;">Зрозуміло</button>
        </div>
    </div>

    <div class="app-container">
        <div class="header">
            <a href="index.html" class="back-link">←</a>
            <div class="header-info">
                <h3>Habla Mobile</h3>
                <p id="headerUser">David</p>
            </div>
            <select id="targetLang" class="lang-select">
                <option value="Ukrainian">Українська</option>
                <option value="Spanish" selected>Spanish</option>
                <option value="English">English</option>
                <option value="German">German</option>
                <option value="French">French</option>
                <option value="Italian">Italian</option>
                <option value="Georgian">Georgian</option>
                <option value="Japanese">Japanese</option>
                <option value="Russian">Russian</option>
            </select>
            <button class="settings-btn" onclick="openSettings()" title="Налаштування">⚙️</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message incoming">¡Hola! ¿Cómo estás?</div>
            <div class="message outgoing">Привіт, як справи?</div>
        </div>
        <div class="footer">
            <div class="input-box">
                <input type="text" id="userInput" placeholder="Введіть текст або мікрофон...">
                <button class="send-btn" id="sendBtn" title="Надіслати">➤</button>
            </div>
            <div class="mic-container">
                <span class="mic-label" id="micStatus">Натисніть мікрофон для запису...</span>
                <button class="mic-btn" id="micBtn" title="Голосовий ввід"><span class="mic-icon">🎙</span></button>
            </div>
        </div>
    </div>
    <script>
        const BACKEND_URL = "https://habla-backend-ipqk.onrender.com/api/translate";
        let isRecording = false, recognition = null;
        let lastValidLang = "Spanish"; 
        let lastValidUiLang = "Ukrainian";
        
        const inputField = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');
        const targetLang = document.getElementById('targetLang');
        const micBtn = document.getElementById('micBtn');
        const micStatus = document.getElementById('micStatus');

        // Повні переклади інтерфейсу на всі 9 мов
        const uiTexts = {
            Ukrainian: {
                nicknameTitle: "Введіть ваш нікнейм",
                nicknameDesc: "Це необхідно для ідентифікації тестувальника.",
                nicknamePlaceholder: "Ваш нікнейм...",
                saveBtn: "Зберегти",
                settingsTitle: "⚙️ Налаштування",
                nicknameLabel: "Змінити ваш нікнейм:",
                updateBtn: "Оновити нікнейм",
                uiLangLabel: "Мова інтерфейсу програми:",
                closeBtn: "Закрити",
                aggressorTitle: "Увага",
                aggressorText: "Агресор",
                aggressorOk: "Зрозуміло",
                userInputPlaceholder: "Введіть текст або мікрофон...",
                micStatusText: "Натисніть мікрофон для запису..."
            },
            Spanish: {
                nicknameTitle: "Introduce tu apodo",
                nicknameDesc: "Esto es necesario para la identificación del probador.",
                nicknamePlaceholder: "Tu apodo...",
                saveBtn: "Guardar",
                settingsTitle: "⚙️ Configuración",
                nicknameLabel: "Cambiar tu apodo:",
                updateBtn: "Actualizar apodo",
                uiLangLabel: "Idioma de la interfaz:",
                closeBtn: "Cerrar",
                aggressorTitle: "Atención",
                aggressorText: "Agresor",
                aggressorOk: "Entendido",
                userInputPlaceholder: "Introduce texto o micrófono...",
                micStatusText: "Haz clic en el micrófono para grabar..."
            },
            English: {
                nicknameTitle: "Enter your nickname",
                nicknameDesc: "This is required for tester identification.",
                nicknamePlaceholder: "Your nickname...",
                saveBtn: "Save",
                settingsTitle: "⚙️ Settings",
                nicknameLabel: "Change your nickname:",
                updateBtn: "Update nickname",
                uiLangLabel: "App Interface Language:",
                closeBtn: "Close",
                aggressorTitle: "Warning",
                aggressorText: "Aggressor",
                aggressorOk: "Understood",
                userInputPlaceholder: "Enter text or microphone...",
                micStatusText: "Click microphone to record..."
            },
            German: {
                nicknameTitle: "Geben Sie Ihren Spitznamen ein",
                nicknameDesc: "Dies ist für die Testeridentifizierung erforderlich.",
                nicknamePlaceholder: "Ihr Spitzname...",
                saveBtn: "Speichern",
                settingsTitle: "⚙️ Einstellungen",
                nicknameLabel: "Spitznamen ändern:",
                updateBtn: "Spitznamen aktualisieren",
                uiLangLabel: "App-Oberflächensprache:",
                closeBtn: "Schließen",
                aggressorTitle: "Achtung",
                aggressorText: "Aggressor",
                aggressorOk: "Verstanden",
                userInputPlaceholder: "Text oder Mikrofon eingeben...",
                micStatusText: "Klicken Sie auf das Mikrofon..."
            },
            French: {
                nicknameTitle: "Entrez votre pseudonyme",
                nicknameDesc: "Ceci est requis pour l'identification du testeur.",
                nicknamePlaceholder: "Votre pseudo...",
                saveBtn: "Enregistrer",
                settingsTitle: "⚙️ Paramètres",
                nicknameLabel: "Changer votre pseudo:",
                updateBtn: "Mettre à jour",
                uiLangLabel: "Langue de l'interface:",
                closeBtn: "Fermer",
                aggressorTitle: "Attention",
                aggressorText: "Agresseur",
                aggressorOk: "Compris",
                userInputPlaceholder: "Entrez du texte ou micro...",
                micStatusText: "Cliquez sur le micro pour enregistrer..."
            },
            Italian: {
                nicknameTitle: "Inserisci il tuo nickname",
                nicknameDesc: "Questo è necessario per l'identificazione del tester.",
                nicknamePlaceholder: "Il tuo nickname...",
                saveBtn: "Salva",
                settingsTitle: "⚙️ Impostazioni",
                nicknameLabel: "Modifica nickname:",
                updateBtn: "Aggiorna nickname",
                uiLangLabel: "Lingua dell'interfaccia:",
                closeBtn: "Chiudi",
                aggressorTitle: "Attenzione",
                aggressorText: "Aggressore",
                aggressorOk: "Capito",
                userInputPlaceholder: "Inserisci testo o microfono...",
                micStatusText: "Clicca sul microfono per registrare..."
            },
            Georgian: {
                nicknameTitle: "შეyванet tqveni metsaxeli",
                nicknameDesc: "es aucilebelia testirebistvis.",
                nicknamePlaceholder: "tqveni metsaxeli...",
                saveBtn: "shenaxva",
                settingsTitle: "⚙️ paraleluri",
                nicknameLabel: "metsaxelis shecvla:",
                updateBtn: "ganaxleba",
                uiLangLabel: "interfeisis ena:",
                closeBtn: "daxurva",
                aggressorTitle: "yuradgeba",
                aggressorText: "agresi",
                aggressorOk: "gasagebia",
                userInputPlaceholder: "sheiyvane teqsti...",
                micStatusText: "daakipet mikrofonts..."
            },
            Japanese: {
                nicknameTitle: "ニックネームを入力してください",
                nicknameDesc: "テスターの識別のために必要です。",
                nicknamePlaceholder: "ニックネーム...",
                saveBtn: "保存",
                settingsTitle: "⚙️ 設定",
                nicknameLabel: "ニックネームを変更:",
                updateBtn: "更新",
                uiLangLabel: "アプリの言語:",
                closeBtn: "閉じる",
                aggressorTitle: "警告",
                aggressorText: "アグレッサー",
                aggressorOk: "了解",
                userInputPlaceholder: "テキストを入力...",
                micStatusText: "マイクをクリック..."
            },
            Russian: {
                nicknameTitle: "Введите ваш никнейм",
                nicknameDesc: "Это необходимо для идентификации тестувальника.",
                nicknamePlaceholder: "Ваш никнейм...",
                saveBtn: "Сохранить",
                settingsTitle: "⚙️ Настройки",
                nicknameLabel: "Изменить ваш никнейм:",
                updateBtn: "Обновить никнейм",
                uiLangLabel: "Язык интерфейса приложения:",
                closeBtn: "Закрыть",
                aggressorTitle: "Внимание",
                aggressorText: "Агрессор",
                aggressorOk: "Понятно",
                userInputPlaceholder: "Введите текст или микрофон...",
                micStatusText: "Нажмите микрофон для записи..."
            }
        };

        function changeUiLang(lang) {
            localStorage.setItem('habla_ui_lang', lang);
            const t = uiTexts[lang] || uiTexts.Ukrainian;
            
            document.getElementById('modalNickTitle').innerText = t.nicknameTitle;
            document.getElementById('modalNickDesc').innerText = t.nicknameDesc;
            document.getElementById('nicknameInput').placeholder = t.nicknamePlaceholder;
            document.getElementById('modalSaveBtn').innerText = t.saveBtn;
            
            document.getElementById('settingsTitle').innerText = t.settingsTitle;
            document.getElementById('settingsNickLabel').innerText = t.nicknameLabel;
            document.getElementById('settingsUpdateBtn').innerText = t.updateBtn;
            document.getElementById('settingsUiLangLabel').innerText = t.uiLangLabel;
            document.getElementById('settingsCloseBtn').innerText = t.closeBtn;
            
            document.getElementById('aggressorTitle').innerText = t.aggressorTitle;
            document.getElementById('aggressorText').innerText = t.aggressorText;
            document.getElementById('aggressorOkBtn').innerText = t.aggressorOk;
            
            document.getElementById('userInput').placeholder = t.userInputPlaceholder;
            document.getElementById('micStatus').innerText = t.micStatusText;
        }

        function handleUiLangChange(selectElement) {
            const val = selectElement.value;
            if (val === 'Russian') {
                selectElement.value = lastValidUiLang;
                document.getElementById('aggressorModal').style.display = 'flex';
            } else {
                lastValidUiLang = val;
                changeUiLang(val);
            }
        }

        // Перевірка та збереження нікнейму та мови інтерфейсу при завантаженні
        window.addEventListener('DOMContentLoaded', () => {
            const savedNickname = localStorage.getItem('habla_nickname');
            const savedUiLang = localStorage.getItem('habla_ui_lang') || 'Ukrainian';
            
            lastValidUiLang = savedUiLang;
            document.getElementById('uiLangSelect').value = savedUiLang;
            changeUiLang(savedUiLang);

            const modal = document.getElementById('nicknameModal');
            const headerUser = document.getElementById('headerUser');
            
            if (!savedNickname) {
                modal.style.display = 'flex';
            } else {
                modal.style.display = 'none';
                if (headerUser) headerUser.innerText = savedNickname;
            }
        });

        function saveNickname() {
            const input = document.getElementById('nicknameInput');
            const nickname = input.value.trim();
            
            if (nickname.length < 2) {
                alert('Будь ласка, введіть коректний нікнейм (мінімум 2 символи)');
                return;
            }
            
            localStorage.setItem('habla_nickname', nickname);
            document.getElementById('nicknameModal').style.display = 'none';
            
            const headerUser = document.getElementById('headerUser');
            if (headerUser) headerUser.innerText = nickname;
        }

        // Функції керування модальним вікном налаштувань (⚙️)
        function openSettings() {
            const currentNickname = localStorage.getItem('habla_nickname') || '';
            document.getElementById('settingsNicknameInput').value = currentNickname;
            
            const savedUiLang = localStorage.getItem('habla_ui_lang') || 'Ukrainian';
            document.getElementById('uiLangSelect').value = savedUiLang;

            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function updateNickname() {
            const input = document.getElementById('settingsNicknameInput');
            const nickname = input.value.trim();
            
            if (nickname.length < 2) {
                alert('Будь ласка, введіть коректний нікнейм (мінімум 2 символи)');
                return;
            }
            
            localStorage.setItem('habla_nickname', nickname);
            const headerUser = document.getElementById('headerUser');
            if (headerUser) headerUser.innerText = nickname;
            
            closeSettings();
        }

        // Логіка мовного меню на головному екрані та захист від "Агресора"
        targetLang.addEventListener('change', (e) => {
            if (e.target.value === 'Russian') {
                e.target.value = lastValidLang;
                document.getElementById('aggressorModal').style.display = 'flex';
            } else {
                lastValidLang = e.target.value;
            }
        });

        function closeAggressorModal() {
            document.getElementById('aggressorModal').style.display = 'none';
        }

        async function sendMessage() {
            const text = inputField.value.trim();
            const lang = targetLang.value;
            
            if (!text) return;
            
            appendMessage(text, 'outgoing');
            inputField.value = '';

            const loadingId = appendMessage("Переклад...", 'incoming');

            try {
                const response = await fetch(BACKEND_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ text: text, targetLanguage: lang }) 
                });

                loadingId.remove();

                if (response.ok) {
                    const data = await response.json();
                    appendMessage(data.translatedText, 'incoming');
                } else { 
                    appendMessage("Помилка сервера при перекладі.", 'incoming'); 
                }
            } catch (err) {
                loadingId.remove();
                appendMessage("Помилка з'єднання з сервером.", 'incoming');
            }
        }

        function appendMessage(text, type) {
            const msgDiv = document.createElement('div'); 
            msgDiv.className = `message ${type}`; 
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv); 
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return msgDiv;
        }

        sendBtn.addEventListener('click', (e) => { e.preventDefault(); sendMessage(); });
        sendBtn.addEventListener('touchend', (e) => { e.preventDefault(); sendMessage(); });
        inputField.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition(); 
            recognition.continuous = true; 
            recognition.interimResults = true;
            
            recognition.onresult = e => {
                let t = ''; 
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    t += e.results[i][0].transcript;
                }
                inputField.value = t;
            };
            recognition.onerror = () => stopRec(); 
            recognition.onend = () => stopRec();
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) { alert("Використовуйте Google Chrome."); return; }
            if (!isRecording) {
                recognition.lang = 'uk-UA';
                recognition.start(); 
                isRecording = true; 
                micBtn.classList.add('recording');
                micStatus.innerText = "Йде запис... Говоріть. Натисніть знову, щоб зупинити.";
            } else { 
                recognition.stop(); 
                stopRec(); 
            }
        });

        function stopRec() {
            isRecording = false; 
            micBtn.classList.remove('recording');
            micStatus.innerText = "Записано! Натисніть стрілочку ➔ для відправки.";
        }
    </script>
</body>
</html>
