<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habla Mobile</title>
    <!-- Підключаємо клієнтську частину Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #1f1f1f;
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        h1 { margin: 0; font-size: 1.2rem; color: #00bcd4; }
        .subtitle { font-size: 0.85rem; color: #888; }
        #online-users {
            padding: 8px 15px;
            background: #181818;
            font-size: 0.85rem;
            color: #00bcd4;
            border-bottom: 1px solid #282828;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        /* Стиль для клікабельних нікнеймів у списку онлайн */
        .user-tag {
            background: #2c2c2c;
            color: #00bcd4;
            border: 1px solid #444;
            padding: 2px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .user-tag:hover {
            background: #00838f;
            color: #fff;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .message.sent {
            background: #00838f;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.received {
            background: #272727;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        #input-container {
            display: flex;
            padding: 10px;
            background: #1f1f1f;
            border-top: 1px solid #333;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px 15px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #00bcd4;
        }
        button {
            background: #00bcd4;
            color: #121212;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>

    <header>
        <h1>Habla Mobile</h1>
        <div class="subtitle" id="user-subtitle">Підключення...</div>
    </header>

    <!-- Рядок зі списком онлайн-користувачів -->
    <div id="online-users">Онлайн: очікування підключення...</div>

    <div id="chat-container">
        <!-- Сюди потраплятимуть повідомлення -->
    </div>

    <div id="input-container">
        <input type="text" id="message-input" placeholder="Введіть текст або мікрофон...">
        <button id="send-btn">&#10148;</button>
    </div>

    <script>
        // Ініціалізація Socket.io
        const socket = io();

        // Запит нікнейму при вході у додаток
        let myNickname = prompt("Введіть ваш нікнейм:") || "Гість";
        document.getElementById('user-subtitle').innerText = myNickname;
        
        // Реєструємо нік на сервері
        socket.emit('register', myNickname);

        // Оновлений блок: тепер кожен користувач у списку стає окремим клікабельним елементом
        socket.on('update-users', (users) => {
            const onlineContainer = document.getElementById('online-users');
            onlineContainer.innerHTML = `Онлайн (${users.length}): `;

            users.forEach((username) => {
                const userTag = document.createElement('span');
                userTag.className = 'user-tag';
                userTag.innerText = username;
                
                // Дія при кліку на конкретного користувача (поки що тестовий заклик)
                userTag.addEventListener('click', () => {
                    alert(`Обрано співрозмовника: ${username}`);
                });

                onlineContainer.appendChild(userTag);
            });
        });

        // Логіка відправки та перекладу повідомлень (збережена робоча база)
        const inputField = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const chatContainer = document.getElementById('chat-container');

        sendBtn.addEventListener('click', async () => {
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(`${myNickname}: ${text}`, 'sent');
            inputField.value = '';

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, targetLanguage: 'Spanish' })
                });
                const data = await response.json();
                if (data.translatedText) {
                    appendMessage(`[Переклад]: ${data.translatedText}`, 'received');
                }
            } catch (err) {
                console.error('Помилка перекладу:', err);
            }
        });

        function appendMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
