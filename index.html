<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habla</title>
    <!-- Підключення маніфесту для Android-додатка та іконки -->
    <link rel="manifest" href="/manifest.json">
    <!-- Підключення клієнтської частини Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        h2 {
            margin-top: 0;
            text-align: center;
            color: #38bdf8;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            background: #3b82f6;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #2563eb;
        }
        .hidden {
            display: none !important;
        }
        .chat-box {
            height: 260px;
            overflow-y: auto;
            border: 1px solid #475569;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            padding: 8px 12px;
            border-radius: 6px;
            max-width: 85%;
            font-size: 14px;
            word-break: break-word;
        }
        .my-msg {
            background: #1d4ed8;
            align-self: flex-end;
        }
        .partner-msg {
            background: #334155;
            align-self: flex-start;
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            display: inline-block;
        }
        .error-text {
            color: #f87171;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- ЕКРАН АВТОРИЗАЦІЇ (НІКНЕЙМ) -->
    <div id="auth-screen">
        <h2>Habla</h2>
        <p style="text-align: center; font-size: 14px; color: #94a3b8;">Введіть ваше унікальне ім'я:</p>
        <input type="text" id="username-input" placeholder="Наприклад: Стас" autocomplete="off">
        <button onclick="registerUser()">Увійти в систему</button>
        <div id="auth-error" class="error-text"></div>
    </div>

    <!-- ЕКРАН МЕСЕНДЖЕРА -->
    <div id="chat-screen" class="hidden">
        <div class="status-bar">
            <span id="connection-dot" class="dot"></span>
            <span id="status-text">Підключення...</span>
        </div>

        <div style="margin-bottom: 10px;">
            <label style="font-size: 12px; color: #94a3b8;">З ким створити чат (ім'я друга):</label>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="partner-input" placeholder="Ім'я співрозмовника" style="margin-top: 5px; margin-bottom: 0;">
                <button onclick="connectToRoom()" style="margin-top: 5px; width: 110px;">З'єднатися</button>
            </div>
        </div>

        <div style="margin-bottom: 10px;">
            <label style="font-size: 12px; color: #94a3b8;">Мова перекладу для співрозмовника:</label>
            <select id="target-lang">
                <option value="English">English (Англійська)</option>
                <option value="Ukrainian">Ukrainian (Українська)</option>
                <option value="Spanish">Spanish (Іспанська)</option>
                <option value="German">German (Німецька)</option>
                <option value="French">French (Французька)</option>
            </select>
        </div>

        <div id="chat-messages" class="chat-box"></div>

        <div style="display: flex; gap: 5px;">
            <input type="text" id="message-input" placeholder="Введіть текст..." style="margin: 0;" onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" style="margin: 0; width: 85px;">Надіслати</button>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let myUsername = '';
    let currentRoom = '';

    const connectionDot = document.getElementById('connection-dot');
    const statusText = document.getElementById('status-text');

    socket.on('connect', () => {
        connectionDot.style.backgroundColor = '#22c55e';
        statusText.innerText = 'Сервер активний';
    });

    socket.on('disconnect', () => {
        connectionDot.style.backgroundColor = '#ef4444';
        statusText.innerText = 'Зв\'язок втрачено...';
    });

    function registerUser() {
        const username = document.getElementById('username-input').value.trim();
        const errorDiv = document.getElementById('auth-error');

        if (!username) {
            errorDiv.innerText = "Будь ласка, введіть ім'я!";
            return;
        }

        socket.emit('register-username', username, (response) => {
            if (response.success) {
                myUsername = username;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('chat-screen').classList.remove('hidden');
            } else {
                errorDiv.innerText = response.message;
            }
        });
    }

    function connectToRoom() {
        const partner = document.getElementById('partner-input').value.trim();
        if (!partner) {
            alert("Будь ласка, введіть ім'я співрозмовника!");
            return;
        }
        if (partner === myUsername) {
            alert("Не можна створювати чат із самим собою!");
            return;
        }

        const names = [myUsername, partner].sort();
        currentRoom = `room_${names[0]}_${names[1]}`;

        socket.emit('join-room', currentRoom);
        appendSystemMessage(`Створено приватний чат із користувачем: ${partner}`);
    }

    function sendMessage() {
        const textInput = document.getElementById('message-input');
        const text = textInput.value.trim();
        const targetLang = document.getElementById('target-lang').value;

        if (!text) return;
        if (!currentRoom) {
            alert("Спершу введіть ім'я співрозмовника та натисніть «З'єднатися»!");
            return;
        }

        appendMessage(`Я: ${text}`, 'my-msg');

        socket.emit('send-message', {
            room: currentRoom,
            text: text,
            targetLanguage: targetLang
        });

        textInput.value = '';
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    socket.on('receive-message', (data) => {
        playNotificationSound();

        connectionDot.style.backgroundColor = '#3b82f6';
        setTimeout(() => {
            connectionDot.style.backgroundColor = '#22c55e';
        }, 3000);

        appendMessage(`${data.sender}: ${data.translatedText}`, 'partner-msg');
    });

    function appendMessage(text, className) {
        const box = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function appendSystemMessage(text) {
        const box = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.style.textAlign = 'center';
        div.style.color = '#94a3b8';
        div.style.fontSize = '12px';
        div.style.margin = '5px 0';
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function playNotificationSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        } catch (e) {
            console.log("Аудіо заблоковано браузером до першої взаємодії");
        }
    }
</script>
</body>
</html>
