<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habla Mobile</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }
        .header {
            padding: 15px;
            text-align: center;
            background: #1e293b;
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 1px solid #334155;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message-bubble {
            background: #1e293b;
            padding: 12px 15px;
            border-radius: 12px;
            max-width: 80%;
            align-self: flex-start;
            border: 1px solid #334155;
        }
        .message-bubble.sent {
            background: #3b82f6;
            align-self: flex-end;
            border: none;
        }
        .sender-name {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .message-text {
            font-size: 0.95rem;
            word-break: break-word;
        }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: #1e293b;
            padding: 10px 0;
            border-top: 1px solid #334155;
        }
        .nav-item {
            color: #94a3b8;
            text-align: center;
            font-size: 0.8rem;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="header" id="app-header">Habla Mobile</div>

    <div class="chat-container" id="chat-container">
        <!-- Повідомлення динамічно додаються сюди -->
    </div>

    <div class="nav-bar">
        <a href="#" class="nav-item">Inicio</a>
        <a href="#" class="nav-item">Contactos</a>
        <a href="#" class="nav-item">Texto</a>
        <a href="#" class="nav-item">QR</a>
        <a href="#" class="nav-item">Ajustes</a>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        // Автоматична реєстрація сервіс-воркера для push-сповіщень
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker зареєстровано', reg))
                .catch(err => console.log('Помилка реєстрації SW', err));
        }

        // Приклад ідентифікації користувача при вході
        const username = prompt("Введіть ваше ім'я:") || "Stas";
        socket.emit('join', { username: username, lang: 'es' });

        socket.on('incoming-message', (msg) => {
            const container = document.getElementById('chat-container');
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${msg.isSent ? 'sent' : ''}`;
            
            const senderDiv = document.createElement('div');
            senderDiv.className = 'sender-name';
            senderDiv.textContent = msg.sender || 'notebook';

            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            textDiv.textContent = msg.text;

            bubble.appendChild(senderDiv);
            bubble.appendChild(textDiv);
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        });
    </script>
</body>
</html>
