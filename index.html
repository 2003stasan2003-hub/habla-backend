<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habla Mobile</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --text-color: #e0e0e0;
            --text-muted: #888888;
            --border-color: #333333;
            --accent-blue: #007bff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Шапка програми (як на еталонному скріншоті) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .app-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
            line-height: 1.2;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-color);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .header-right select {
            background: transparent;
            color: var(--text-color);
            border: none;
            outline: none;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* Центральна область розмови */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 1.05rem;
            overflow-y: auto;
            gap: 12px;
        }

        /* Нижня панель введення */
        .footer-panel {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
        }

        .mic-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 10px 16px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        .input-wrapper::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            background-color: var(--accent-blue);
            color: #ffffff;
            border: none;
            border-radius: 24px;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        /* Бокове меню (Сайдбар) */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            z-index: 99;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100%;
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            transition: left 0.3s ease;
            z-index: 100;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .close-menu {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .user-card {
            background: #2a2a2a;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: var(--accent-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
        }

        .user-details .name {
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            color: var(--primary-color);
        }

        .user-details .hint {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .menu-action-btn {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-bottom: 10px;
            text-align: center;
            font-size: 0.95rem;
        }

        .menu-action-btn.secondary {
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .sidebar-footer label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
        }

        .sidebar-footer select {
            width: 100%;
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }

        /* КАСТОМНЕ МОДАЛЬНЕ ВІКНО */
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .custom-modal {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            width: 85%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .custom-modal h3 {
            font-size: 1.05rem;
            color: var(--text-color);
        }

        .custom-modal p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .custom-modal input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        .custom-modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 4px;
        }

        .custom-modal-buttons button {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            border: none;
        }

        .btn-cancel {
            background: #333333;
            color: var(--text-color);
        }

        .btn-confirm {
            background: var(--accent-blue);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Шапка програми -->
    <header>
        <div class="header-left">
            <button class="menu-btn" id="openMenu">☰</button>
            <div class="app-title">Habla<br>Mobile</div>
        </div>
        <div class="header-right">
            <span style="color: var(--text-muted);">На:</span>
            <select id="targetLangHeader">
                <option value="es" selected>Español</option>
                <option value="uk">Українська</option>
                <option value="en">English</option>
                <option value="de">Deutsch</option>
            </select>
        </div>
    </header>

    <!-- Центральний екран розмови -->
    <div class="chat-container" id="chatArea">
        Почніть розмову або введіть текст...
    </div>

    <!-- Нижня панель введення -->
    <div class="footer-panel">
        <button class="mic-btn" id="micBtn" title="Голосовий ввід">🎤</button>
        <input type="text" class="input-wrapper" id="inputText" placeholder="Почніть розмову або введіть текст...">
        <button class="send-btn" id="sendBtn">Надіслати</button>
    </div>

    <!-- Бокове меню -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>Меню</span>
            <button class="close-menu" id="closeMenu">✕</button>
        </div>

        <div class="user-card">
            <div class="user-avatar" id="userAvatarLetter">U</div>
            <div class="user-details">
                <div class="name" id="userNameDisplay" title="Натисніть, щоб змінити нік">User</div>
                <div class="hint">Натисніть на нік, щоб змінити</div>
            </div>
        </div>

        <button class="menu-action-btn" id="addContactBtn">+ Додати користувача</button>
        <button class="menu-action-btn secondary" id="qrCodeBtn">QR-код та APK</button>

        <div class="sidebar-footer">
            <label>Мова інтерфейсу / Вхідна мова</label>
            <select id="sourceLangMenu">
                <option value="uk" selected>Українська</option>
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
            </select>
        </div>
    </div>

    <!-- Кастомне модальне вікно -->
    <div class="custom-modal-overlay" id="customModalOverlay">
        <div class="custom-modal">
            <h3 id="modalTitle">Додати співрозмовника</h3>
            <p id="modalPromptDesc">Введіть нікнейм тестувальника.</p>
            <input type="text" id="modalInput" placeholder="Напр. Stasan або Phone">
            <div class="custom-modal-buttons">
                <button class="btn-cancel" id="modalCancelBtn">Скасувати</button>
                <button class="btn-confirm" id="modalConfirmBtn">OK</button>
            </div>
        </div>
    </div>

    <script>
        // Ініціалізація нікнейму користувача
        let myNickname = localStorage.getItem('habla_nickname');
        if (!myNickname) {
            myNickname = 'User-' + Math.floor(100 + Math.random() * 900);
            localStorage.setItem('habla_nickname', myNickname);
        }

        function updateUIUser() {
            document.getElementById('userNameDisplay').innerText = myNickname;
            document.getElementById('userAvatarLetter').innerText = myNickname.charAt(0).toUpperCase();
        }
        updateUIUser();

        // Підключення до Socket.io
        const socket = io();

        socket.on('connect', () => {
            socket.emit('register_user', { nickname: myNickname });
        });

        // Меню
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        document.getElementById('openMenu').onclick = () => {
            sidebar.classList.add('open');
            sidebarOverlay.style.display = 'block';
        };

        const closeSidebar = () => {
            sidebar.classList.remove('open');
            sidebarOverlay.style.display = 'none';
        };

        document.getElementById('closeMenu').onclick = closeSidebar;
        sidebarOverlay.onclick = closeSidebar;

        // Зміна нікнейму при натисканні на нього в меню
        document.getElementById('userNameDisplay').onclick = () => {
            showModal("Зміна нікнейму", "Введіть новий нікнейм для цього пристрою:", myNickname, (newNick) => {
                if (newNick) {
                    myNickname = newNick.trim();
                    localStorage.setItem('habla_nickname', myNickname);
                    updateUIUser();
                    socket.emit('register_user', { nickname: myNickname });
                    alert(`Нік змінено на: ${myNickname}`);
                }
            });
        };

        // Модальне вікно (універсальне)
        const modalOverlay = document.getElementById('customModalOverlay');
        const modalInput = document.getElementById('modalInput');
        const modalTitle = document.getElementById('modalTitle');
        const modalPromptDesc = document.getElementById('modalPromptDesc');
        let modalCallback = null;

        function showModal(title, desc, defaultVal, callback) {
            modalTitle.innerText = title;
            modalPromptDesc.innerText = desc;
            modalInput.value = defaultVal || '';
            modalOverlay.style.display = 'flex';
            modalInput.focus();
            modalCallback = callback;
        }

        document.getElementById('modalCancelBtn').onclick = () => {
            modalOverlay.style.display = 'none';
            modalCallback = null;
        };

        document.getElementById('modalConfirmBtn').onclick = () => {
            const val = modalInput.value.trim();
            modalOverlay.style.display = 'none';
            if (modalCallback && val) {
                modalCallback(val);
            }
            modalCallback = null;
        };

        modalInput.onkeydown = (e) => {
            if (e.key === 'Enter') {
                document.getElementById('modalConfirmBtn').click();
            }
        };

        // Кнопка "+ Додати користувача"
        document.getElementById('addContactBtn').onclick = () => {
            closeSidebar();
            showModal("Додати співрозмовника", "Введіть нікнейм тестувальника, з яким хочете зв'язатися:", "", (targetNick) => {
                socket.emit('find_user', targetNick, (res) => {
                    if (res.success) {
                        alert(`Успішно! Знайдено тестувальника: ${res.nickname}`);
                    } else {
                        alert(res.message);
                    }
                });
            });
        };

        // Кнопка завантаження APK
        document.getElementById('qrCodeBtn').onclick = () => {
            window.location.href = '/downloads/habla.apk';
        };

        // Переклад
        document.getElementById('sendBtn').onclick = async () => {
            const text = document.getElementById('inputText').value.trim();
            const targetLang = document.getElementById('targetLangHeader').value;
            const chatArea = document.getElementById('chatArea');

            if (!text) return;

            chatArea.innerHTML = `Перекладається...`;

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, targetLang })
                });
                const data = await response.json();
                chatArea.innerHTML = `
                    <div style="background: #1e1e1e; padding: 12px; border-radius: 8px; border: 1px solid #333; width: 100%; text-align: left;">
                        <div style="color: #888; font-size: 0.85rem; margin-bottom: 4px;">Ви (${myNickname}): ${text}</div>
                        <div style="color: #e0e0e0; font-size: 1rem;"><b>Переклад:</b> ${data.translatedText || 'Помилка'}</div>
                    </div>
                `;
                document.getElementById('inputText').value = '';
            } catch (e) {
                chatArea.innerHTML = `Помилка з'єднання з сервером`;
            }
        };
    </script>
</body>
</html>
