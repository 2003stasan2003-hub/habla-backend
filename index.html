<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хабла - Перекладач</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Шапка */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #111827;
            border-bottom: 1px solid #1f2937;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-btn, .settings-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
        }
        .title-block h1 {
            font-size: 16px;
            font-weight: 600;
        }
        .title-block span {
            font-size: 11px;
            color: #9ca3af;
            letter-spacing: 0.5px;
        }
        .lang-select-wrapper {
            position: relative;
        }
        .lang-select {
            background: transparent;
            border: 1px solid #06b6d4;
            color: #06b6d4;
            padding: 6px 28px 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            appearance: none;
            cursor: pointer;
        }
        .lang-select-wrapper::after {
            content: '⌄';
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #06b6d4;
            pointer-events: none;
        }

        /* Область повідомлень */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }
        .message.user {
            align-self: flex-end;
            background-color: #0891b2;
            color: #ffffff;
            border: 1px solid #22d3ee;
            border-bottom-right-radius: 4px;
        }
        .message.translated {
            align-self: flex-start;
            background-color: #1f2937;
            color: #e5e7eb;
            border: 1px solid #374151;
            border-bottom-left-radius: 4px;
        }

        /* Нижня панель керування */
        .footer-panel {
            padding: 12px 16px;
            background-color: #111827;
            border-top: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .input-box-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            border: 1px solid #06b6d4;
            border-radius: 16px;
            padding: 8px 12px;
            background-color: #0b0f19;
        }
        .input-box-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }
        .input-box-wrapper input::placeholder {
            color: #6b7280;
        }
        .send-btn {
            background: none;
            border: none;
            color: #06b6d4;
            font-size: 20px;
            cursor: pointer;
            padding-left: 8px;
        }
        .mic-status {
            font-size: 12px;
            color: #9ca3af;
        }
        .mic-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #0891b2;
            border: 2px solid #22d3ee;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
            transition: transform 0.1s;
        }
        .mic-btn:active {
            transform: scale(0.95);
        }
        .mic-icon {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="header-left">
            <button class="menu-btn">&#9776;</button>
            <div class="title-block">
                <h1>Тест</h1>
                <span>STASAN</span>
            </div>
        </div>
        <div class="lang-select-wrapper">
            <select id="targetLang" class="lang-select">
                <option value="Spanish">Spanish</option>
                <option value="English">English</option>
                <option value="German">German</option>
            </select>
        </div>
        <button class="settings-btn">&#9881;</button>
    </header>

    <!-- Чат -->
    <div id="chatContainer" class="chat-container">
        <!-- Приклад повідомлень -->
        <div class="message user">Привіт Привіт</div>
        <div class="message translated">[Spanish] Привіт Привіт</div>
    </div>

    <!-- Низ -->
    <div class="footer-panel">
        <div class="input-box-wrapper">
            <input type="text" id="textInput" placeholder="Enter text or microphone...">
            <button id="sendBtn" class="send-btn">&#10148;</button>
        </div>
        <div class="mic-status">Натисніть мікрофон для запису...</div>
        <button id="micBtn" class="mic-btn">
            <svg class="mic-icon" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.39-.9.89 0 2.12-1.83 3.89-3.98 3.89-2.15 0-3.98-1.77-3.98-3.89 0-.5-.41-.89-.9-.89s-.9.39-.9.89c0 2.62 1.98 4.81 4.48 5.14V20h2v-2.97c2.5-.33 4.48-2.52 4.48-5.14 0-.5-.41-.89-.9-.89z"/>
            </svg>
        </button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const targetLangSelect = document.getElementById('targetLang');

        // Бекенд API URL (Render)
        const BACKEND_URL = 'https://habla-backend-ipqk.onrender.com';

        async function sendAndTranslate(text) {
            if (!text.trim()) return;

            // Додаємо оригінальне повідомлення користувача
            appendMessage(text, 'user');
            textInput.value = '';

            const targetLang = targetLangSelect.value;

            try {
                const response = await fetch(`${BACKEND_URL}/api/translate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, target_language: targetLang })
                });

                if (response.ok) {
                    const data = await response.json();
                    const translatedText = data.translated_text || data.translation || `[${targetLang}] ${text}`;
                    appendMessage(`[${targetLang}] ${translatedText}`, 'translated');
                } else {
                    appendMessage(`[${targetLang}] ${text}`, 'translated');
                }
            } catch (err) {
                console.error('Помилка перекладу:', err);
                // Фолбек у разі офлайну/помилки мережі
                appendMessage(`[${targetLang}] ${text}`, 'translated');
            }
        }

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        sendBtn.addEventListener('click', () => {
            sendAndTranslate(textInput.value);
        });

        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendAndTranslate(textInput.value);
            }
        });

        // Інтеграція Web Speech API для мікрофона
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'uk-UA';
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                try {
                    recognition.start();
                } catch (e) {
                    console.log(e);
                }
            });

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                sendAndTranslate(speechToText);
            };
        }
    </script>
</body>
</html>
