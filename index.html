<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habla Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .menu-icon {
            font-size: 20px;
            cursor: pointer;
            color: #38bdf8;
        }
        .app-title {
            font-size: 18px;
            font-weight: 600;
            color: #38bdf8;
        }
        .user-profile-badge {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .avatar-circle {
            width: 32px;
            height: 32px;
            background-color: #0ea5e9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }
        .main-container {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background-color: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            bottom: 0;
            left: -280px;
            transition: left 0.3s ease;
            z-index: 10;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #334155;
        }
        .sidebar-header h3 {
            font-size: 16px;
            color: #f8fafc;
        }
        #closeSidebar {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
        }
        .users-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            background-color: #334155;
            cursor: pointer;
            transition: background 0.2s;
        }
        .user-item:hover {
            background-color: #475569;
        }
        .user-info-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar-circle-small {
            width: 28px;
            height: 28px;
            background-color: #38bdf8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .status-indicator.online {
            background-color: #22c55e;
        }
        .status-indicator.offline {
            background-color: #64748b;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0f172a;
            height: 100%;
        }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            background-color: #1e293b;
            padding: 12px;
            border-radius: 12px;
            max-width: 80%;
        }
        .chat-input-area {
            display: flex;
            padding: 12px;
            background-color: #1e293b;
            gap: 8px;
            align-items: center;
        }
        .chat-input-area input {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 10px 16px;
            color: white;
            outline: none;
        }
        .btn-action {
            background-color: #0ea5e9;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .add-section {
            padding: 12px;
            border-top: 1px solid #334155;
        }
        .add-section h4 {
            font-size: 14px;
            margin-bottom: 8px;
            color: #94a3b8;
        }
        .add-btn {
            background-color: #22c55e;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            color: white;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="menu-icon" id="menuToggle">☰</div>
        <h1 class="app-title">Habla Mobile</h1>
        <div class="user-profile-badge">
            <span class="avatar-circle" id="myAvatar">T</span>
            <span id="myName">Tester</span>
        </div>
    </div>

    <div class="main-container">
        <!-- Сайдбар із персональними контактами -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>Контакти (Usuarios)</h3>
                <button id="closeSidebar">✕</button>
            </div>

            <div class="users-list" id="usersListContainer">
                <!-- Ваші контакти -->
            </div>

            <div class="add-section">
                <h4>Доступні користувачі</h4>
                <div id="availableUsersContainer">
                    <!-- Користувачі для додавання -->
                </div>
            </div>
        </div>

        <!-- Зона чату -->
        <div class="chat-area">
            <div class="chat-messages" id="chatMessages">
                <!-- Повідомлення -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Введіть повідомлення...">
                <button class="btn-action" id="sendBtn">➤</button>
            </div>
        </div>
    </div>

    <!-- Підключення Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Запит імені при вході (введіть StasAn, щоб протестувати адмін-режим)
        const currentUsername = prompt("Введіть ваше ім'я:", "Tester") || "Tester";
        document.getElementById('myName').textContent = currentUsername;
        document.getElementById('myAvatar').textContent = currentUsername.charAt(0).toUpperCase();

        // Реєстрація на сервері
        socket.emit('register_user', { name: currentUsername });

        // Перевірка статусу адміністратора
        socket.emit('check_admin');
        socket.on('admin_status', (data) => {
            if (data.isAdmin) {
                console.log("Адмін-доступ активовано для StasAn");
            }
        });

        // Керування сайдбаром
        const menuToggle = document.getElementById('menuToggle');
        const closeSidebar = document.getElementById('closeSidebar');
        const sidebar = document.getElementById('sidebar');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.add('open');
            socket.emit('get_available_users');
        });

        closeSidebar.addEventListener('click', () => {
            sidebar.classList.remove('open');
        });

        // Оновлення персональних контактів у сайдбарі
        socket.on('contacts_update', (contacts) => {
            const container = document.getElementById('usersListContainer');
            container.innerHTML = '';

            if (contacts.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8; font-size: 13px; padding: 8px;">Список контактів порожній.</p>';
                return;
            }

            contacts.forEach(contact => {
                const item = document.createElement('div');
                item.className = 'user-item';
                item.innerHTML = `
                    <div class="user-info-wrapper">
                        <div class="avatar-circle-small">${contact.name.charAt(0).toUpperCase()}</div>
                        <span class="user-name">${contact.name}</span>
                    </div>
                    <span class="status-indicator ${contact.online ? 'online' : 'offline'}"></span>
                `;
                container.appendChild(item);
            });
        });

        // Оновлення списку доступних для додавання користувачів
        socket.on('available_users_update', (availableList) => {
            const container = document.getElementById('availableUsersContainer');
            container.innerHTML = '';

            availableList.forEach(user => {
                const item = document.createElement('div');
                item.style.display = 'flex';
                item.style.justifyContent = 'space-between';
                item.style.alignItems = 'center';
                item.style.marginBottom = '6px';
                item.style.fontSize = '13px';

                item.innerHTML = `
                    <span>${user.name}</span>
                    ${user.isContact 
                        ? '<span style="color: #22c55e; font-size: 12px;">У контактах</span>' 
                        : `<button class="add-btn" data-name="${user.name}">Додати</button>`
                    }
                `;
                container.appendChild(item);
            });

            container.querySelectorAll('.add-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const nameToAdd = btn.getAttribute('data-name');
                    socket.emit('add_contact', nameToAdd);
                });
            });
        });

        // Обробка надсилання повідомлень
        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');
        const chatMessages = document.getElementById('chatMessages');

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            socket.emit('chat_message', { text: text });
            messageInput.value = '';
        }

        socket.on('chat_message', (data) => {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `<strong>${data.senderName}:</strong> ${data.text}`;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });
    </script>
</body>
</html>
